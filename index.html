    ['tugMs', '拉扯間隔 ms', 120, 1200, 20],
    ['tugCatch', '拉扯 拉上來機率', 0.02, 0.9, 0.01],
    ['tugEscape', '拉扯 被掙脫機率', 0.02, 0.9, 0.01],
    ['catchRate', '捕獲率 一般魚', 0.05, 1, 0.01],
    ['catchRateGlow', '捕獲率 發光魚群', 0.05, 1, 0.01],
    ['stateMode', '內部狀態', 0, 2, 1, ['回收期', '普通', '開放期']],
    ['openMul', '開放期乘數', 1, 2, 0.05],
    ['recMul', '回收期乘數', 0.2, 1, 0.05],
  ],
};
let T = JSON.parse(JSON.stringify(DEF));
(function loadTune() {
  try {
    const d = JSON.parse(localStorage.getItem(TUNE_KEY) || 'null');
    if (d && d.version === TUNE_VERSION) {
      for (const g of Object.keys(DEF)) Object.assign(T[g], d[g] || {});
    }
  } catch (e) { /* 壞掉就用預設 */ }
})();
function saveTune() {
  localStorage.setItem(TUNE_KEY, JSON.stringify(Object.assign({ version: TUNE_VERSION }, T)));
}

/* ============ 遊戲狀態 ============ */
const S = {
  phase: 'BET',          // BET | DRAW | FREE | SETTLE
  round: 1,
  balance: T.econ.startBalance,
  pockets: [],           // 長度 16，元素為 sushi id 或 SP_POCKET
  kinds: [],             // 本局出現的 sushi id
  counts: {},            // sushi id -> 格數
  totalBet: 0, totalWin: 0,   // 累計（跨局）
  plates: [],            // 押注的盤
  balls: [],             // 已落定的球（pocket index）
  ballAnim: null,        // 正在飛的球
  betSum: 0, winSum: 0,
  selected: [],          // 目前選取的種類
  kind: 'maru',
  hitTypes: new Set(),   // 命中過的種類（畫面標示用）
  hitCount: {},          // 每種開出幾顆球（同一種可以押多貫，所以要算數量）
  spHit: false,
  spItems: null,         // 老闆SP 特別輪盤：pocket index -> 獎項 key
  spFree: null,          // 特別輪盤可用的格子
  exBall: null,          // 第 6 顆 EX 球
  pendingShun: null,     // 漁中撈到的特殊壽司魚 → 下一局可押
  stamps: 0,             // 印章數（跨局累積）
  stampPot: 0,           // 距離下一個印章還差多少押注額
  wheelK: 0,             // 輪盤大小 0=押注（有迴轉帶）1=抽選（放大滿版）
  wheelKT: 0,            // 目標值
  wheelRot: 0,           // 輪盤自轉角度（弧度），持續累加
  rotT: 0,               // 上一次推進自轉的時間戳
  betEndAt: 0,           // 押注截止時間（performance.now()）
  autoT: null,           // 「結算 → 下一局」的計時器
};

/* ============ 工具 ============ */
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
/* 左欄只放「開球紀錄」，其餘訊息不進畫面（要看細節開 console） */
function log(msg) { console.log(msg); }

/* ============ 開球紀錄（一局一列） ============ */
const HIST = [];                      // 新的在前
function histNew(round) { HIST.unshift({ round, balls: [], win: 0, done: false }); if (HIST.length > 60) HIST.pop(); renderHist(); }
function histBall(t) { if (HIST[0]) { HIST[0].balls.push(t); renderHist(); } }
function histDone(win) { if (HIST[0]) { HIST[0].win = win; HIST[0].done = true; renderHist(); } }
function renderHist() {
  const box = $('log');
  box.innerHTML = HIST.map(h => {
    const balls = h.balls.map(t => t === SP_POCKET ? '<span class="hr-sp">🎴</span>' : iconTag(t, 22)).join('');
    const res = !h.done ? '' : (h.win ? `<span class="hr-win">+${fmt(h.win)}</span>` : '<span class="hr-none">—</span>');
    return `<div class="hrow${h.done ? (h.win ? ' win' : '') : ' cur'}">` +
      `<span class="hr-no">${h.round}局</span><span class="hr-balls">${balls}</span>${res}</div>`;
  }).join('');
}
function comb(n, k) {
  if (k < 0 || k > n) return 0;
  let r = 1;
  for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1);
  return r;
}

/* ============ 盤面生成 ============ */
function newBoard() {
  const kmin = Math.min(T.prob.kindsMin, T.prob.kindsMax);
  const kmax = Math.max(T.prob.kindsMin, T.prob.kindsMax);
  const K = kmin + rnd(kmax - kmin + 1);
  const kinds = shuffle(SUSHI.map(s => s.id)).slice(0, K);

  // 15 格分配給 K 種：每種至少 1 格，其餘按隨機權重分配
  const counts = {};
  kinds.forEach(k => counts[k] = 1);
  let left = 15 - K;
  // 稀有種傾向：讓部分種類保持 1 格（高賠率來源）
  const weights = kinds.map(() => Math.pow(Math.random(), T.prob.rareBias * 2 + 0.2));
  while (left > 0) {
    let total = 0;
    kinds.forEach((k, i) => { if (counts[k] < 5) total += weights[i]; });
    let r = Math.random() * total, idx = -1;
    for (let i = 0; i < kinds.length; i++) {
      if (counts[kinds[i]] >= 5) continue;
      r -= weights[i];
      if (r <= 0) { idx = i; break; }
    }
    if (idx < 0) idx = kinds.findIndex(k => counts[k] < 5);
    if (idx < 0) break;
    counts[kinds[idx]]++; left--;
  }

  // 排進 16 格（含 1 格老闆SP）
  const slots = [];
  kinds.forEach(k => { for (let i = 0; i < counts[k]; i++) slots.push(k); });
  shuffle(slots);
  const spAt = rnd(16);
  const pockets = [];
  let si = 0;
  for (let i = 0; i < 16; i++) pockets.push(i === spAt ? SP_POCKET : slots[si++]);

  S.pockets = pockets; S.kinds = kinds; S.counts = counts;
  makeBelt();                      // 盤面換了 → 迴轉帶上的組合也重配
}

/* ============ 迴轉帶：系統配好的壽司組合（實機是一盤盤從你面前經過，看上眼就拿）============
   每局重配：從稀有到常見各配幾組，讓玩家一眼看到「賭大的」跟「穩的」兩種選擇。 */
const BELT = { list: [], rot: 0, sel: -1 };

function makeBelt() {
  const ks = S.kinds.slice().sort((a, b) => S.counts[a] - S.counts[b]);   // 稀有在前
  const n = ks.length, mid = Math.floor(n / 2);
  const out = [];
  const add = (kind, types) => {
    if (types.some(t => t === undefined)) return;
    const need = {};
    for (const t of types) { need[t] = (need[t] || 0) + 1; if (need[t] > S.counts[t]) return; }  // 貫數不能超過格數
    if (out.some(o => o.kind === kind && o.types.slice().sort().join() === types.slice().sort().join())) return;
    out.push({ kind, types });
  };
  add('maru', [ks[0]]);                       // 圓盤：最稀有 1 種（高賠）
  if (S.counts[ks[n - 1]] >= 2) add('maru', [ks[n - 1], ks[n - 1]]);        // 圓盤：同種 2 貫
  if (S.counts[ks[n - 1]] >= 2) add('geta', [ks[n - 1], ks[n - 1], ks[n - 2]]); // 三貫：同種 2 貫＋1 種
  add('maru', [ks[n - 1]]);                   // 圓盤：最常見 1 種（穩）
  add('maru', [ks[0], ks[1]]);                // 圓盤：兩種稀有
  add('geta', ks.slice(0, 3));                // 三貫：全稀有
  add('geta', ks.slice(-3));                  // 三貫：全常見
  add('geta', [ks[0], ks[mid], ks[n - 1]]);   // 三貫：混搭
  if (n >= 5) {
    add('funa', ks.slice(0, 5));              // 五貫：全稀有（最高賠）
    add('funa', ks.slice(-5));                // 五貫：全常見
  }
  BELT.list = out;
  BELT.sel = -1;
  refreshBeltPay();
}

/* 每盤的 BINGO得分（賠率變動時要跟著更新） */
function refreshBeltPay() {
  BELT.list.forEach(c => {
    c.mult = multOf(c.kind, c.types);
    c.per = Math.round(STAKE[c.kind] * c.mult);
  });
}

/* 點迴轉帶上的盤子 → 直接套用那組合 */
function pickBelt(i) {
  const c = BELT.list[i];
  if (!c || S.phase !== 'BET') return;
  BELT.sel = i;
  S.kind = c.kind;
  S.selected = c.types.slice();
  const per = Math.round(STAKE[c.kind] * multOf(c.kind, c.types));
  notice(`已選 ${KIND_NAME[c.kind]}：${c.types.map(t => SUSHI[t].name).join('＋')}　BINGO得分 ${fmt(per)}`, true);
  refreshAll();
}

/* ============ 賠率計算 ============ */
// 命中機率：所選每一種都至少被 1 顆球命中（16 格取 5，容斥原理）
/* 命中機率：types 允許重複——同一種選 2 貫，就是要 5 顆球裡有 2 顆落在那種的格子。
   算法：對每一種列舉「落了幾顆球」，其餘球落在沒被選到的格子。 */
function hitProb(types) {
  const need = new Map();
  types.forEach(t => need.set(t, (need.get(t) || 0) + 1));
  const ks = [...need.keys()];
  const c = ks.map(t => S.counts[t] || 0);
  const m = ks.map(t => need.get(t));
  for (let i = 0; i < ks.length; i++) if (m[i] > c[i]) return 1e-9;   // 格數不夠，永遠不可能中
  const rest = 16 - c.reduce((a, b) => a + b, 0);
  const total = comb(16, 5);
  let p = 0;
  (function rec(i, used, ways) {
    if (i === ks.length) { p += ways * comb(rest, 5 - used); return; }
    for (let x = m[i]; x <= Math.min(c[i], 5 - used); x++) rec(i + 1, used + x, ways * comb(c[i], x));
  })(0, 0, 1);
  return Math.max(p / total, 1e-9);
}
function rangeOf(kind) {
  const e = T.econ;
  if (kind === 'maru') return [e.maruLo, e.maruHi];
  if (kind === 'geta') return [e.getaLo, e.getaHi];
  return [e.funaLo, e.funaHi];
}
function multOf(kind, types) {
  const [lo, hi] = rangeOf(kind);
  const raw = T.prob.rtp / hitProb(types);
  return Math.min(hi, Math.max(lo, raw));
}
const STAKE = { maru: 3, geta: 5, funa: 10 };
const KIND_NAME = { maru: '圓盤', geta: '三貫', funa: '五貫', shun: '特殊壽司' };
const KIND_SIZE = { maru: [1, 2], geta: [3, 3], funa: [5, 5] };

/* 選壽司過程中的當選額區間：
   還沒選滿時，補「格數最少的幾種」＝最高賠付，補「格數最多的幾種」＝最低賠付。 */
function payRange(kind, sel) {
  const [lo, hi] = KIND_SIZE[kind];
  const stake = STAKE[kind];
  if (!sel.length) return null;
  if (sel.length >= lo) {                       // 已達下限 → 目前這組就是確定值
    const m = multOf(kind, sel);
    return { exact: true, min: Math.round(stake * m), max: Math.round(stake * m), maxMul: m };
  }
  const rest = S.kinds.filter(t => !sel.includes(t)).sort((a, b) => S.counts[a] - S.counts[b]);
  const need = lo - sel.length;
  if (rest.length < need) return null;
  const best = sel.concat(rest.slice(0, need));           // 補最稀有 → 賠付最高
  const worst = sel.concat(rest.slice(-need));            // 補最常見 → 賠付最低
  const mMax = multOf(kind, best), mMin = multOf(kind, worst);
  return { exact: false, min: Math.round(stake * mMin), max: Math.round(stake * mMax), maxMul: mMax };
}

/* ============ 押注 ============ */
function plateKey(kind, types) { return kind + ':' + types.slice().sort((a, b) => a - b).join(','); }

/* 押注失敗的原因要讓玩家看得到（log 只進 console） */
function notice(msg, good) { S.notice = { msg, at: performance.now(), good: !!good }; }

/* 回傳 true/false，讓「＋10 盤」知道能不能繼續加 */
function addPlate(kind, types, quiet) {
  const fail = m => { S.lastFail = m; if (!quiet) notice(m); log(m); return false; };
  if (S.phase !== 'BET') return fail('抽球中不能押注');
  const stake = kind === 'shun' ? (S.pendingShun ? S.pendingShun.stake : 60) : STAKE[kind];
  if (S.balance < stake) return fail('餘額不足');
  const key = plateKey(kind, types);
  let p = S.plates.find(x => x.key === key);
  // 特殊壽司盤：每人限 1 皿，賠付在老闆SP 抽選
  if (kind === 'shun') {
    if (p) return fail('特殊壽司每人限 1 盤');
    const w = { 60: T.sp.shun60, 120: T.sp.shun120, 240: T.sp.shun240 }[stake] || T.sp.shun60;
    S.plates.push({ key, kind, types: types.slice(), count: 1, mult: w / stake, per: w, stake, free: false, result: null });
    S.balance -= stake; S.betSum += stake; S.totalBet += stake;
    gainStamp(stake);
    log(`押特殊壽司 ${SUSHI[types[0]].name}（${stake} 枚）`);
    refreshAll(); return true;
  }
  const mult = multOf(kind, types);
  const per = Math.round(stake * mult);
  if (p) {
    if (p.count >= T.econ.maxPlates) return fail(`這個組合已達 ${T.econ.maxPlates} 盤上限`);
    p.count++;
  } else {
    p = { key, kind, types: types.slice(), count: 1, mult, per, stake, free: false, result: null };
    // FREE CHOICE：只有三貫與五貫有機會取得
    if (kind !== 'maru' && Math.random() < T.prob.freeChance) p.free = true;
    S.plates.push(p);
    if (p.free) log(`✨ ${KIND_NAME[kind]} 取得 FREE CHOICE`);
  }
  S.balance -= stake; S.betSum += stake; S.totalBet += stake;
  gainStamp(stake);
  refreshAll();
  return true;
}

/* 印章：押注額累積，但「一次押注最多給 1 個」（[攻略] 原機規則） */
function gainStamp(stake) {
  S.stampPot += stake;
  if (S.stampPot < T.sp.stampPer) return;
  S.stampPot -= T.sp.stampPer;
  if (S.stampPot > T.sp.stampPer) S.stampPot = T.sp.stampPer - 1;   // 一次最多 1 個，多的不累到第 2 個
  S.stamps++;
  const msg = S.stamps === T.sp.stampJP ? `🏅 印章 ${S.stamps} 個 — 老闆SP 可押 JP 了！`
    : S.stamps === T.sp.stampPurin ? `🏅 印章 ${S.stamps} 個 — 老闆SP 可押布丁了！`
      : `🏅 印章 +1（${S.stamps} 個）`;
  notice(msg, true); log(msg);
}

/* 這個組合現在最多還能加幾盤（餘額／盤數上限／得分上限，取最小） */
function canAddCount(kind, types, want) {
  if (S.phase !== 'BET') return 0;
  if (kind === 'shun') return S.plates.some(p => p.kind === 'shun') ? 0 : Math.min(1, want);
  const stake = STAKE[kind];
  const per = Math.round(stake * multOf(kind, types));
  const p = S.plates.find(x => x.key === plateKey(kind, types));
  const cur = p ? p.count : 0;
  return Math.max(0, Math.min(
    want,
    T.econ.maxPlates - cur,                      // 同組合盤數上限
    Math.floor(S.balance / stake)                // 餘額
  ));
}

/* 一次加 n 盤：加到不能加為止，並說明停在哪 */
function addPlates(kind, types, n) {
  S.lastFail = '';
  let got = 0;
  for (let i = 0; i < n; i++) {
    if (!addPlate(kind, types, true)) break;
    got++;
  }
  if (got < n) notice(`只加了 ${got} 盤 — ${S.lastFail}`);
  refreshAll();
}

function clearBets() {
  if (S.phase !== 'BET') return;
  S.balance += S.betSum; S.totalBet -= S.betSum; S.betSum = 0; S.plates = [];
  refreshAll(); log('已清除本局押注（選取的壽司保留）', 'd');
}

/* ============ 局循環：押注 30 秒 → 自動開球 → 結算 → 自動下一局 ============
   機台是不會停的：輪盤一直轉，押注時間到就開，沒押注就當作這局空過。 */
function clearAuto() { if (S.autoT) { clearTimeout(S.autoT); S.autoT = null; } }

function startBetPhase() {
  clearAuto();
  S.phase = 'BET';
  S.betEndAt = performance.now() + T.rhythm.betSeconds * 1000;
}

function scheduleNext() {
  clearAuto();
  S.nextAt = performance.now() + T.rhythm.roundGap * 1000;
  S.autoT = setTimeout(() => {
    S.autoT = null;
    if (S.phase === 'SETTLE') nextRound();
  }, T.rhythm.roundGap * 1000);
}

function betLeft() {
  return S.phase === 'BET' ? Math.max(0, (S.betEndAt - performance.now()) / 1000) : 0;
}

/* ============ 抽球 ============ */
function deal() {
  if (S.phase !== 'BET') return;
  clearAuto();
  S.phase = 'DRAW';
  S.balls = []; S.hitTypes = new Set(); S.hitCount = {}; S.spHit = false;
  // 5 顆球落在互不相同的 5 格
  S.drawOrder = shuffle([...Array(16).keys()]).slice(0, 5);
  histNew(S.round);
  S.wheelKT = 1; FX.expand = performance.now();     // 迴轉帶收掉、輪盤放大
  log(S.plates.length
    ? `第 ${S.round} 局開始抽球（押注 ${S.betSum} 枚）`
    : `第 ${S.round} 局開球 — 本局未押注，空過`);
  refreshAll();
  startFx(() => dropBall(0));
}

/* 畫面中央的轉場字幕（開球、老闆SP…）：實機在事件發生前都會先喊一次 */
function bannerFx(main, sub, cls, ms, cb) {
  const el = $('startFx');
  if (!el || ms <= 0) { cb && cb(); return; }
  el.querySelector('.sf-sub').textContent = sub || '';
  el.querySelector('.sf-main').textContent = main;
  el.className = cls || '';
  void el.offsetWidth;                 // 重置動畫
  el.style.setProperty('--sf', ms + 'ms');
  el.classList.add('go');
  setTimeout(() => { el.classList.remove('go'); cb && cb(); }, ms);
}
function startFx(cb) { bannerFx('抽選開始', `第 ${S.round} 局`, '', T.rhythm.startFx, cb); }

function dropBall(i) {
  // 防重入：只有在抽球階段、球數剛好等於 i、且沒有球正在飛時才發球。
  // （少了這道，連點「繼續」會開出第二條抽球鏈 → 抽出 7 顆球且結算跑兩次）
  if (S.phase !== 'DRAW' || S.balls.length !== i || S.ballAnim) return;
  const idx = S.drawOrder[i];
  const targetAngle = pocketAngleLocal(idx);
  S.ballAnim = { t0: performance.now(), idx, from: targetAngle + Math.PI * 2 * T.rhythm.spinTurns, to: targetAngle, i };
  const step = now => {
    if (!S.ballAnim || S.phase !== 'DRAW') return;    // 局被外部重置（換局／強開）就別再畫
    const k = Math.min(1, (now - S.ballAnim.t0) / T.rhythm.ballTravel);
    const e = 1 - Math.pow(1 - k, 3);   // ease-out
    S.ballAnim.cur = S.ballAnim.from + (S.ballAnim.to - S.ballAnim.from) * e;
    draw();
    if (k < 1) { requestAnimationFrame(step); return; }
    S.ballAnim = null;
    S.balls.push(idx);
    const t = S.pockets[idx];
    histBall(t);
    if (t === SP_POCKET) { S.spHit = true; log(`第 ${i + 1} 球 → 🎴 老闆SP！`, 'b'); }
    else {
      S.hitTypes.add(t); S.hitCount[t] = (S.hitCount[t] || 0) + 1;
      log(`第 ${i + 1} 球 → ${SUSHI[t].emoji} ${SUSHI[t].name}`);
    }
    refreshAll();
    setTimeout(() => afterBall(i), T.rhythm.ballGap);
  };
  requestAnimationFrame(step);
}

function afterBall(i) {
  if (i === 2) {
    // 前 3 球結束 → FREE CHOICE
    const cands = S.plates.filter(p => p.free && !p.freeUsed && missingOf(p).length);
    if (cands.length) {
      S.phase = 'FREE'; S.freeAt = performance.now() + T.rhythm.freeSeconds * 1000;
      notice('✨ FREE CHOICE — 點座位上你缺的那貫壽司，就當作命中', true);
      refreshAll(); return;
    }
    dropBall(3); return;
  }
  if (i === 4) { setTimeout(settle, T.rhythm.settlePause); return; }
  dropBall(i + 1);
}

/* 這盤各種類要幾貫 */
function needMap(p) {
  const m = new Map();
  p.types.forEach(t => m.set(t, (m.get(t) || 0) + 1));
  return m;
}
/* 這盤這種類目前拿到幾貫（FREE CHOICE 算 1 貫） */
function haveOf(p, t) { return (S.hitCount[t] || 0) + (p.freeUsed === t ? 1 : 0); }
/* 還差的種類（不重複列） */
function missingOf(p) {
  const out = [];
  needMap(p).forEach((n, t) => { if (haveOf(p, t) < n) out.push(t); });
  return out;
}
/* 這盤是否已完成 */
function plateDone(p) {
  let ok = true;
  needMap(p).forEach((n, t) => { if (haveOf(p, t) < n) ok = false; });
  return ok;
}

/* FREE CHOICE：直接在「我的座位」點那盤缺的壽司，那貫就算命中 */
function freeCands() {
  return S.plates.filter(p => p.free && !p.freeUsed && !p.result && missingOf(p).length);
}
function useFree(p, t) {
  if (S.phase !== 'FREE' || !p.free || p.freeUsed || !missingOf(p).includes(t)) return;
  p.freeUsed = t;
  log(`✨ FREE CHOICE：${SUSHI[t].name} 視為命中`);
  notice(`✨ ${SUSHI[t].name} 視為命中`, true);
  refreshAll();
  if (!freeCands().length) setTimeout(endFree, 420);    // 都用掉了 → 直接繼續抽球
}

/* 時間到還沒選 → 自動幫玩家選：挑「格數最少」那種，因為它最難靠剩下的球自己開出來 */
function autoFreePick() {
  S.plates.forEach(p => {
    if (!p.free || p.freeUsed || p.result) return;
    const miss = missingOf(p);
    if (!miss.length) return;
    const t = miss.slice().sort((a, b) => S.counts[a] - S.counts[b])[0];
    p.freeUsed = t;
    log(`✨ FREE CHOICE（自動）：${SUSHI[t].name} 視為命中`);
  });
}

function endFree() {
  if (S.phase !== 'FREE') return;          // 防連點／防重入
  autoFreePick();
  S.phase = 'DRAW'; refreshAll();
  dropBall(3);
}

/* ============ 結算 ============ */
/* ============ 演出：金幣噴發、盤面發光、中獎快報 ============ */
const FX = { coins: [], glow: 0, glowT: 0, spReveal: 0, expand: 0 };

function burstCoins(n, cxp, cyp) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
    const sp = 3.2 + Math.random() * 5.2;
    FX.coins.push({
      x: cxp, y: cyp, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
      r: 7 + Math.random() * 6, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .35, life: 1,
    });
  }
}
function celebrate(amount, title) {
  FX.glow = 1; FX.glowT = performance.now();
  burstCoins(Math.min(60, 16 + Math.round(amount / 24)), CX, CY + 40);
  toast(title || 'BINGO！', `+${amount} 枚`);
}
function toast(big, small) {
  const el = $('toast');
  $('toastIn').innerHTML = big + (small ? `<small>${small}</small>` : '');
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1900);
}
function stepFX(now) {
  FX.coins.forEach(c => {
    c.vy += 0.32; c.x += c.vx; c.y += c.vy; c.rot += c.vr;
    if (c.y > CY + 300) c.life = 0;
  });
  FX.coins = FX.coins.filter(c => c.life > 0);
  if (FX.glow) FX.glow = Math.max(0, 1 - (now - FX.glowT) / 1100);
}
function drawFX(now) {
  // 盤面發光
  if (FX.glow > 0) {
    const g = cx.createRadialGradient(CX, CY, R_IN * .6, CX, CY, R_OUT + 30);
    g.addColorStop(0, `rgba(233,181,63,0)`);
    g.addColorStop(.72, `rgba(233,181,63,${.34 * FX.glow})`);
    g.addColorStop(1, `rgba(233,181,63,0)`);
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(CX, CY, R_OUT + 30, 0, 6.28); cx.fill();
    cx.strokeStyle = `rgba(248,220,154,${.85 * FX.glow})`;
    cx.lineWidth = 3 + 5 * FX.glow;
    cx.beginPath(); cx.arc(CX, CY, R_OUT + 8, 0, 6.28); cx.stroke();
  }
  // 金幣
  FX.coins.forEach(c => {
    cx.save();
    cx.translate(c.x, c.y); cx.rotate(c.rot);
    const w = Math.abs(Math.cos(c.rot)) * c.r + 2;   // 旋轉時的厚薄感
    const g = cx.createLinearGradient(-w, -c.r, w, c.r);
    g.addColorStop(0, '#fff4cd'); g.addColorStop(.5, '#e9b53f'); g.addColorStop(1, '#9a6f14');
    cx.beginPath(); cx.ellipse(0, 0, w, c.r, 0, 0, 6.28);
    cx.fillStyle = g; cx.fill();
    cx.strokeStyle = '#7c5510'; cx.lineWidth = 1.4; cx.stroke();
    if (w > c.r * .55) {
      cx.fillStyle = 'rgba(124,85,16,.75)';
      cx.font = `bold ${Math.round(c.r)}px sans-serif`;
      cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.fillText('壽', 0, 1);
    }
    cx.restore();
  });
}

/* 整局得分上限：本局押注額（含撈魚投入）的 N 倍，超過的部分不給 */
function roundCap() { return S.betSum * T.econ.maxWinMul; }
function addWin(n) {
  const room = Math.max(0, roundCap() - S.winSum);
  if (n > room) {
    log(`⚠ 觸及整局得分上限（押注 ${fmt(S.betSum)} ×${fmt(T.econ.maxWinMul)}＝${fmt(roundCap())}），本次只給 ${fmt(room)}`);
    notice(`已達整局得分上限 ${fmt(roundCap())} 枚`);
    n = room;
  }
  if (n <= 0) return 0;
  S.winSum += n; S.balance += n; S.totalWin += n;
  return n;
}

function payIfComplete(p, tag) {
  if (p.kind === 'shun' || p.result) return 0;
  if (!plateDone(p)) return 0;
  const w = p.per * p.count;
  p.result = w; addWin(w);
  log(`🎉 BINGO${tag || ''} ${KIND_NAME[p.kind]}（${p.types.map(t => SUSHI[t].name).join('＋')}）×${p.count} 盤 → ${w} 枚`, 'w');
  celebrate(w, w >= 500 ? 'BIG WIN！' : 'BINGO！');
  return w;
}

function settle() {
  if (S.phase !== 'DRAW') return;          // 只結算一次
  S.phase = 'SETTLE';
  let win = 0;
  S.plates.forEach(p => {
    if (p.kind === 'shun') return;          // 特殊壽司盤只在老闆SP 抽選
    win += payIfComplete(p);
    if (!p.result) p.result = 0;
  });
  if (!win && S.plates.length) log('5 球結算：沒有中獎', 'd');
  refreshAll();
  // 沒押注就不進老闆SP：整局得分上限＝押注×N，押注 0 的話中什麼都是 0，演出反而奇怪
  if (S.spHit && S.betSum > 0) setTimeout(startSP, T.rhythm.settlePause);
  else { histDone(S.winSum); scheduleNext(); }
}

function finishRound() {
  S.plates.forEach(p => { if (p.result == null) p.result = 0; });
  S.phase = 'SETTLE';
  $('fishBar').style.display = 'none';
  $('stage').classList.remove('fishing');   // 轉盤回來
  log(`本局結束：贏分 ${S.winSum} 枚（押注 ${S.betSum}）`, S.winSum > S.betSum ? 'w' : 'd');
  histDone(S.winSum);
  refreshAll();
  scheduleNext();
}

function nextRound() {
  if (S.phase !== 'SETTLE') return;
  // 特殊壽司盤只在「取得的下一局」可押，過期就清掉
  if (S.pendingShun && S.round >= S.pendingShun.forRound) S.pendingShun = null;
  S.round++; S.plates = []; S.selected = []; S.betSum = 0; S.winSum = 0;
  S.balls = []; S.hitTypes = new Set(); S.hitCount = {}; S.spHit = false;
  S.spItems = null; S.spFree = null; S.exBall = null;
  S.wheelKT = 0;                                     // 回到押注：輪盤縮小、迴轉帶回來
  startBetPhase();
  newBoard(); refreshAll();
  log(`── 第 ${S.round} 局 ──`, 'd');
}

/* ============ 老闆SP（原機的老闆特別抽選） ============ */
const SP_ITEMS = {
  ryo:     { label: '漁',        emoji: '🎣', color: '#0284c7' },
  shunryo: { label: '特殊漁',    emoji: '✨', color: '#0891b2' },
  dairyo:  { label: '大漁',      emoji: '🌊', color: '#be123c' },
  purin:   { label: '布丁',      emoji: '🍮', color: '#db2777' },
  jp:      { label: 'JP',        emoji: '💎', color: '#b45309' },
  shun:    { label: '特殊壽司',  emoji: '🐟', color: '#7c3aed' },
  gag:     { label: '空獎',      emoji: '😑', color: '#475569' },
};

function startSP() {
  if (S.phase !== 'SETTLE' || S.spItems) return;
  S.phase = 'SP';
  const free = [];
  for (let i = 0; i < 16; i++) if (!S.balls.includes(i)) free.push(i);
  // 特別輪盤配置：漁與特殊漁常設、大漁機率、
  // 布丁與 JP 要有足夠印章才會出現（[攻略] 5 個換布丁、10 個換 JP），其餘空獎
  const items = ['ryo', 'ryo', 'shunryo'];
  if (Math.random() < T.sp.dairyo) items.push('dairyo');
  if (S.stamps >= T.sp.stampPurin) items.push('purin');
  if (S.stamps >= T.sp.stampJP) items.push('jp');
  if (S.plates.some(p => p.kind === 'shun')) items.push('shun');
  while (items.length < free.length) items.push('gag');
  items.length = free.length;
  shuffle(items);
  S.spItems = {}; free.forEach((idx, i) => S.spItems[idx] = items[i]);
  S.spFree = free;
  log(`🎴 老闆SP！沒有球的 ${free.length} 格重配成特別輪盤（印章 ${S.stamps} 個）`);
  refreshAll();
  // 轉場：喊一聲「老闆SP」→ 輪盤逐格翻成特別輪盤 → 發 EX 球
  bannerFx('老闆SP', '追加第 6 顆 EX 球', 'sp', T.rhythm.spFx, () => {
    FX.spReveal = performance.now();   // 特別輪盤逐格翻開
    setTimeout(dropEX, 80 + free.length * 80 + 260);
  });
}

function dropEX() {
  if (S.phase !== 'SP' || S.exBall) return;
  const idx = pick(S.spFree);
  const a = pocketAngleLocal(idx);
  S.exBall = { idx, from: a + Math.PI * 2 * T.rhythm.spinTurns, to: a, t0: performance.now(), cur: null };
  const step = now => {
    if (!S.exBall || S.phase !== 'SP') return;
    const k = Math.min(1, (now - S.exBall.t0) / (T.rhythm.ballTravel * 1.4));
    const e = 1 - Math.pow(1 - k, 3);
    S.exBall.cur = S.exBall.from + (S.exBall.to - S.exBall.from) * e;
    draw();
    if (k < 1) { requestAnimationFrame(step); return; }
    S.exBall.landed = true; draw();
    setTimeout(() => resolveSP(idx), 350);
  };
  requestAnimationFrame(step);
}

function resolveSP(idx) {
  if (S.phase !== 'SP') return;
  const it = S.spItems[idx];
  log(`EX 球 → ${SP_ITEMS[it].emoji} ${SP_ITEMS[it].label}`, 'b');
  if (it === 'purin') {
    S.stamps = Math.max(0, S.stamps - T.sp.stampPurin);      // 印章換掉了
    addWin(T.sp.purinWin); log(`🍮 布丁 +${T.sp.purinWin} 枚（用掉 ${T.sp.stampPurin} 個印章）`);
    celebrate(T.sp.purinWin, `🍮 布丁　-${T.sp.stampPurin} 印章`); finishRound(); return;
  }
  if (it === 'jp') {
    S.stamps = Math.max(0, S.stamps - T.sp.stampJP);
    addWin(T.sp.jpWin); log(`💎 JP +${T.sp.jpWin} 枚（用掉 ${T.sp.stampJP} 個印章）`);
    celebrate(T.sp.jpWin, `💎 JACKPOT！　-${T.sp.stampJP} 印章`); finishRound(); return;
  }
  if (it === 'shun') {
    const p = S.plates.find(x => x.kind === 'shun');
    const w = { 60: T.sp.shun60, 120: T.sp.shun120, 240: T.sp.shun240 }[p.stake] || T.sp.shun60;
    p.result = w; addWin(w);
    log(`🐟 特殊壽司 ${SUSHI[p.types[0]].name}（押 ${p.stake}）命中 → +${w} 枚`, 'w');
    celebrate(w, '🐟 特殊壽司命中！');
    finishRound(); return;
  }
  if (it === 'gag') { log('😑 一發搞笑 — 空獎', 'd'); finishRound(); return; }
  startFishing(it);   // ryo / shunryo / dairyo
}

/* ============ 漁（撈魚小遊戲） ============ */
const FISH = { list: [], mode: 'ryo', weapon: 'grab', endAt: 0, raf: null, lastSpawn: 0, shunSpawned: false, ripple: null, spent: 0, gained: 0, over: true, hook: null };
const fcv = $('fish'), fx = fcv.getContext('2d');

/* 命中不保證：發射要付費，撈得到與否由捕獲率 × 內部狀態決定，失手是純損失。
   （攻略把「漁完全撈不到、整場負的」列為壞台特徵，好台則是「漁很好撈」） */
const STATE_NAME = ['回收期', '普通', '開放期'];
function stateMul() {
  return T.fish.stateMode === 2 ? T.fish.openMul : T.fish.stateMode === 0 ? T.fish.recMul : 1;
}
function catchChance(f) {
  const base = f.school ? T.fish.catchRateGlow : T.fish.catchRate;
  return Math.max(0, Math.min(1, base * stateMul()));
}
function spook(f, now) {          // 失手：魚受驚彈開
  f.spookT = now;
  f.vx *= 3.1; f.amp = Math.max(2, f.amp * 0.35); f.spooked = true;
}

function startFishing(mode) {
  S.phase = 'FISH';
  FISH.mode = mode; FISH.list = []; FISH.weapon = 'grab';
  FISH.lastSpawn = 0; FISH.shunSpawned = false; FISH.ripple = null; FISH.hook = null;
  FISH.spent = 0; FISH.gained = 0; FISH.over = true;   // 轉場結束才開始算時間
  $('fishBar').style.display = 'block';
  $('fishTitle').textContent = mode === 'dairyo' ? '🌊 大漁 — 魚群密度提升'
    : mode === 'shunryo' ? '✨ 特殊壽司漁 — 會出現特殊壽司魚' : '🎣 漁';
  $('cNet').textContent = T.fish.netCost; $('cGrab').textContent = T.fish.grabCost;
  $('fishTime').textContent = T.fish.duration.toFixed(1);
  $('fishNet').textContent = '0';
  $('fishHint').innerHTML =
    `魚繞著漁場轉，<b>只撈得到自己面前那一區</b>。單抓＝勾住後拉扯，每 ${(T.fish.tugMs / 1000).toFixed(1)} 秒扣 ` +
    `<b>${T.fish.grabCost}</b> 枚直到拉上來或被掙脫；網一次 <b>${T.fish.netCost}</b> 枚、範圍內一次判定。` +
    `　🔴 圈＝盤上還缺的種類（狀態：${STATE_NAME[T.fish.stateMode]}）`;
  log(`進入 ${$('fishTitle').textContent}（${T.fish.duration} 秒・${STATE_NAME[T.fish.stateMode]}）`);
  refreshAll();
  // 轉場：喊一聲 → 畫面切成海面 → 才開始計時
  const title = $('fishTitle').textContent.replace(/ —.*/, '');
  bannerFx(title, '只撈得到自己面前的魚', 'sea', T.rhythm.fishFx, () => {
    $('stage').classList.add('fishing');
    FISH.endAt = performance.now() + T.fish.duration * 1000;
    FISH.over = false;
    FISH.raf = requestAnimationFrame(fishLoop);
  });
}

function neededTypes() {
  const s = new Set();
  S.plates.forEach(p => { if (p.kind !== 'shun' && !p.result) missingOf(p).forEach(t => s.add(t)); });
  return s;
}

/* ============ 漁場：圓形，魚繞著圈游，玩家坐在下方 ============ */
const SEAT_ANG = Math.PI / 2;              // 玩家的位置（畫面下方）
const R_SEA = 268;                          // 漁場半徑
function angDiff(a, b) {
  let d = (a - b) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}
function inReach(ang) { return Math.abs(angDiff(ang, SEAT_ANG)) <= T.fish.reachDeg * Math.PI / 180; }
function fishR(f) { return f.rad + Math.sin(f.wobPh) * f.wobAmp; }
function fishXY(f) { const r = fishR(f); return [CX + Math.cos(f.ang) * r, CY + Math.sin(f.ang) * r]; }
function seatXY() { return [CX + Math.cos(SEAT_ANG) * (R_SEA - 6), CY + Math.sin(SEAT_ANG) * (R_SEA - 6)]; }

function spawnFish(now) {
  const need = [...neededTypes()];
  const mk = (opt) => {
    const type = opt.type != null ? opt.type
      : (need.length && Math.random() < 0.3 ? pick(need)
        : (Math.random() < 0.6 ? pick(S.kinds) : pick(SUSHI).id));
    const dir = Math.random() < 0.5 ? 1 : -1;
    return {
      ang: opt.ang != null ? opt.ang : Math.random() * Math.PI * 2,
      rad: opt.rad != null ? opt.rad : 80 + Math.random() * 150,
      av: opt.av != null ? opt.av : dir * (0.16 + Math.random() * 0.2),   // 角速度 rad/s
      wobPh: Math.random() * 6.28, wobAmp: 3 + Math.random() * 7,
      r: opt.school ? 15 : (opt.shun ? 22 : 13 + Math.random() * 5),
      type, school: !!opt.school, shun: !!opt.shun, tier: opt.tier || 0,
      value: opt.shun ? 0 : (opt.school
        ? Math.round(T.fish.schoolMin + Math.random() * (T.fish.schoolMax - T.fish.schoolMin))
        : Math.round(T.fish.fishMin + Math.random() * (T.fish.fishMax - T.fish.fishMin))),
      dead: false, born: now, until: now + (11 + Math.random() * 9) * 1000,
    };
  };
  if (FISH.mode === 'dairyo' && Math.random() < 0.4) {
    // 魚群：同一條軌道上一串會發光的高價魚
    const base = mk({ school: true });
    const n = 4 + rnd(4);
    for (let i = 0; i < n; i++) {
      const f = mk({ school: true, type: base.type, rad: base.rad, av: base.av,
                     ang: base.ang - Math.sign(base.av) * i * 0.11 });
      FISH.list.push(f);
    }
  } else {
    FISH.list.push(mk({}));
  }
  // 特殊壽司漁：開始 2.5 秒後放一隻特殊壽司魚
  if (FISH.mode === 'shunryo' && !FISH.shunSpawned && now > FISH.endAt - (T.fish.duration * 1000 - 2500)) {
    FISH.shunSpawned = true;
    FISH.list.push(mk({ shun: true, tier: pick([60, 120, 240]) }));
    log('✨ 特殊壽司魚出現了！撈到牠，下一局就能押特殊壽司');
  }
}

/* ---- 單抓＝拉扯：勾住後每 tugMs 扣一次錢，直到拉上來或被掙脫 ---- */
function tugCatchP(f) {
  const boost = f.school ? T.fish.catchRateGlow / T.fish.catchRate : 1;
  return Math.max(0, Math.min(0.95, T.fish.tugCatch * boost * stateMul()));
}
function startTug(f, now) {
  FISH.hook = { f, t0: now, last: now - T.fish.tugMs, ticks: 0, tension: 0 };
}
function stepTug(now) {
  const h = FISH.hook;
  if (!h) return;
  const f = h.f;
  if (f.dead || !FISH.list.includes(f)) { FISH.hook = null; return; }
  if (now - h.last < T.fish.tugMs) return;
  h.last = now;
  const cost = T.fish.grabCost;
  if (S.balance < cost) { FISH.hook = null; notice('餘額不足，線放掉了'); return; }
  S.balance -= cost; S.betSum += cost; S.totalBet += cost; FISH.spent += cost;
  h.ticks++;
  const pc = tugCatchP(f), pe = T.fish.tugEscape;
  const r = Math.random();
  if (r < pc) {                       // 拉上來了
    catchFish(f);
    FISH.hook = null;
  } else if (r < pc + pe) {           // 被掙脫
    spook(f, now);
    FISH.hook = null;
    log(`🎣 被掙脫（這次拉扯花了 ${h.ticks * cost} 枚）`);
    notice(`被掙脫！這次拉扯花了 ${h.ticks * cost} 枚`);
  } else {
    h.tension = Math.min(1, h.tension + 0.22);   // 還在拉
  }
  refreshAll();
}

function fishLoop(now) {
  if (S.phase !== 'FISH' || FISH.over) return;
  const left = Math.max(0, FISH.endAt - now);
  $('fishTime').textContent = (left / 1000).toFixed(1);
  const net = FISH.gained - FISH.spent;
  const el = $('fishNet');
  el.textContent = (net > 0 ? '+' : '') + fmt(net);
  el.style.color = net >= 0 ? 'var(--jade-2)' : '#ff8b8b';
  const rate = T.fish.spawnMs / (FISH.mode === 'dairyo' ? T.fish.dairyoMul : 1);
  if (now - FISH.lastSpawn > rate && FISH.list.length < T.fish.maxFish) { FISH.lastSpawn = now; spawnFish(now); }
  const dt = 1 / 60;
  const hooked = FISH.hook && FISH.hook.f;
  FISH.list.forEach(f => {
    const slow = f === hooked ? 0.25 : (f.spooked ? 2.4 : 1);
    f.ang += f.av * dt * slow;
    f.wobPh += dt * (f === hooked ? 9 : 2.2);
  });
  FISH.list = FISH.list.filter(f => !f.dead && now < f.until);
  stepTug(now);
  drawFish(now);
  if (left <= 0) { endFishing(); return; }
  FISH.raf = requestAnimationFrame(fishLoop);
}

function drawFish(now) {
  const W = GW, H = GH;
  fx.setTransform(HD, 0, 0, HD, 0, 0);
  fx.clearRect(0, 0, W, H);
  // 檯面
  fx.fillStyle = '#080d19'; fx.fillRect(0, 0, W, H);

  fx.save();
  fx.beginPath(); fx.arc(CX, CY, R_SEA, 0, 6.28); fx.clip();
  // 海水：中心亮、外圈深
  const g = fx.createRadialGradient(CX, CY - 40, 30, CX, CY, R_SEA);
  g.addColorStop(0, '#0e5c86'); g.addColorStop(.55, '#08304a'); g.addColorStop(1, '#04121f');
  fx.fillStyle = g; fx.fillRect(CX - R_SEA, CY - R_SEA, R_SEA * 2, R_SEA * 2);
  // 水流：跟著轉的同心弧
  fx.strokeStyle = 'rgba(255,255,255,.05)'; fx.lineWidth = 2;
  for (let i = 0; i < 7; i++) {
    const rr = 50 + i * 32;
    const a0 = (now / 2600) * (i % 2 ? 1 : -1) + i;
    fx.beginPath(); fx.arc(CX, CY, rr, a0, a0 + 1.5); fx.stroke();
  }
  // 氣泡
  fx.fillStyle = 'rgba(255,255,255,.12)';
  for (let i = 0; i < 16; i++) {
    const a = i * 0.39 + now / 5200;
    const rr = ((now / 26 + i * 47) % (R_SEA - 30)) + 20;
    fx.beginPath(); fx.arc(CX + Math.cos(a) * rr, CY + Math.sin(a) * rr, 1.5 + (i % 3), 0, 6.28); fx.fill();
  }

  // 自己的可撈範圍：下方的扇形
  const rw = T.fish.reachDeg * Math.PI / 180;
  fx.save();
  fx.beginPath();
  fx.moveTo(CX, CY);
  fx.arc(CX, CY, R_SEA, SEAT_ANG - rw, SEAT_ANG + rw);
  fx.closePath();
  const rg = fx.createRadialGradient(CX, CY, 40, CX, CY, R_SEA);
  rg.addColorStop(0, 'rgba(125,211,252,.03)'); rg.addColorStop(1, 'rgba(125,211,252,.16)');
  fx.fillStyle = rg; fx.fill();
  fx.setLineDash([7, 6]); fx.lineDashOffset = -now / 90;
  fx.strokeStyle = 'rgba(165,226,255,.6)'; fx.lineWidth = 2;
  fx.beginPath();
  fx.moveTo(CX, CY); fx.lineTo(CX + Math.cos(SEAT_ANG - rw) * R_SEA, CY + Math.sin(SEAT_ANG - rw) * R_SEA);
  fx.moveTo(CX, CY); fx.lineTo(CX + Math.cos(SEAT_ANG + rw) * R_SEA, CY + Math.sin(SEAT_ANG + rw) * R_SEA);
  fx.stroke();
  fx.restore();

  const need = neededTypes();
  const hooked = FISH.hook && FISH.hook.f;
  const sorted = FISH.list.slice().sort((a, b) => fishXY(a)[1] - fishXY(b)[1]);
  sorted.forEach(f => {
    const [x, y] = fishXY(f);
    const reach = inReach(f.ang);
    fx.save();
    if (!reach) fx.globalAlpha = 0.4;                 // 不在自己面前 → 撈不到，畫淡一點
    if (f.school || f.shun) {
      const rg2 = fx.createRadialGradient(x, y, 2, x, y, f.r * 2.6);
      rg2.addColorStop(0, f.shun ? 'rgba(250,204,21,.55)' : 'rgba(74,222,128,.42)');
      rg2.addColorStop(1, 'rgba(0,0,0,0)');
      fx.fillStyle = rg2;
      fx.beginPath(); fx.arc(x, y, f.r * 2.6, 0, 6.28); fx.fill();
    }
    if (need.has(f.type)) {
      fx.save();
      fx.setLineDash([5, 4]); fx.lineDashOffset = -now / 60;
      fx.strokeStyle = 'rgba(248,113,113,.95)'; fx.lineWidth = 2;
      fx.beginPath(); fx.arc(x, y, f.r * 1.9 + Math.sin(now / 220) * 1.5, 0, 6.28); fx.stroke();
      fx.restore();
    }
    // 魚頭朝著游動方向
    const dir = f.av >= 0 ? 1 : -1;
    fx.save();
    fx.translate(x, y);
    fx.rotate(f.ang + (dir > 0 ? Math.PI / 2 : -Math.PI / 2));
    drawFishShape(fx, 0, 0, f.r, 1, f.type, now, { gold: f.shun });
    fx.restore();
    if (f === hooked) {                               // 被勾住：白光顫抖
      fx.globalAlpha = 0.85;
      fx.strokeStyle = '#fff7d6'; fx.lineWidth = 2;
      fx.beginPath(); fx.arc(x, y, f.r * 1.6, 0, 6.28); fx.stroke();
    }
    if (f.spookT && now - f.spookT < 520) {
      const k = 1 - (now - f.spookT) / 520;
      fx.globalAlpha = k * 0.85; fx.fillStyle = '#fff';
      fx.beginPath(); fx.arc(x, y, f.r * 1.5, 0, 6.28); fx.fill();
      fx.globalAlpha = k; fx.fillStyle = '#fca5a5';
      fx.font = 'bold 12px "Noto Sans TC", sans-serif';
      fx.textAlign = 'center'; fx.textBaseline = 'middle';
      fx.fillText('跑掉了！', x, y - f.r * 2 - (1 - k) * 14);
    }
    // 價值標籤
    const txt = f.shun ? '旬 ' + f.tier : '+' + f.value;
    fx.globalAlpha = reach ? 1 : 0.4;
    fx.font = 'bold 11px "Noto Sans TC", sans-serif';
    const tw = fx.measureText(txt).width + 10;
    fx.fillStyle = f.shun ? 'rgba(180,83,9,.92)' : 'rgba(8,13,24,.72)';
    roundRect(fx, x - tw / 2, y + f.r * 1.1, tw, 16, 8); fx.fill();
    fx.fillStyle = f.shun ? '#fff7d6' : '#e2e8f0';
    fx.textAlign = 'center'; fx.textBaseline = 'middle';
    fx.fillText(txt, x, y + f.r * 1.1 + 8);
    fx.restore();
  });

  // 拉扯中的釣線
  if (hooked) {
    const [sx, sy] = seatXY();
    const [fxp, fyp] = fishXY(hooked);
    fx.save();
    fx.strokeStyle = 'rgba(255,247,214,.9)'; fx.lineWidth = 2;
    fx.beginPath();
    fx.moveTo(sx, sy);
    const mx = (sx + fxp) / 2 + Math.sin(now / 70) * 10, my = (sy + fyp) / 2 + Math.cos(now / 90) * 10;
    fx.quadraticCurveTo(mx, my, fxp, fyp);
    fx.stroke();
    // 張力條
    const bw = 120, bx = CX - bw / 2, by = CY + 96;
    fx.fillStyle = 'rgba(8,13,24,.75)';
    roundRect(fx, bx - 4, by - 4, bw + 8, 20, 8); fx.fill();
    fx.fillStyle = '#f59e0b';
    roundRect(fx, bx, by, bw * (0.25 + FISH.hook.tension * 0.75), 12, 6); fx.fill();
    fx.fillStyle = '#ffe6b3'; fx.font = 'bold 11px "Noto Sans TC", sans-serif';
    fx.textAlign = 'center'; fx.textBaseline = 'middle';
    fx.fillText(`拉扯中… 已花 ${FISH.hook.ticks * T.fish.grabCost} 枚`, CX, by + 6);
    fx.restore();
  }

  // 出手特效
  if (FISH.ripple) {
    const k = (now - FISH.ripple.t0) / 360;
    if (k < 1) {
      const rr = FISH.ripple.rad * (0.45 + k * 0.75);
      fx.save();
      fx.globalAlpha = 1 - k;
      fx.strokeStyle = '#f8fafc'; fx.lineWidth = 3;
      fx.beginPath(); fx.arc(FISH.ripple.x, FISH.ripple.y, rr, 0, 6.28); fx.stroke();
      if (FISH.ripple.rad > 30) {
        fx.lineWidth = 1.4; fx.strokeStyle = 'rgba(248,250,252,.7)';
        for (let i = -2; i <= 2; i++) {
          fx.beginPath();
          fx.moveTo(FISH.ripple.x - rr, FISH.ripple.y + i * rr / 2.5);
          fx.lineTo(FISH.ripple.x + rr, FISH.ripple.y + i * rr / 2.5);
          fx.stroke();
          fx.beginPath();
          fx.moveTo(FISH.ripple.x + i * rr / 2.5, FISH.ripple.y - rr);
          fx.lineTo(FISH.ripple.x + i * rr / 2.5, FISH.ripple.y + rr);
          fx.stroke();
        }
      }
      fx.restore();
    } else FISH.ripple = null;
  }
  fx.restore();     // 解除圓形裁切

  // 漁場邊框＋自己的座位
  fx.beginPath(); fx.arc(CX, CY, R_SEA, 0, 6.28);
  fx.strokeStyle = '#3b4a68'; fx.lineWidth = 6; fx.stroke();
  fx.beginPath(); fx.arc(CX, CY, R_SEA - 3, 0, 6.28);
  fx.strokeStyle = 'rgba(251,191,36,.25)'; fx.lineWidth = 2; fx.stroke();
  const [sx, sy] = seatXY();
  fx.save();
  fx.translate(sx, sy);
  fx.fillStyle = '#e9b53f';
  fx.beginPath(); fx.moveTo(0, -14); fx.lineTo(11, 8); fx.lineTo(-11, 8); fx.closePath(); fx.fill();
  fx.fillStyle = '#0b1120'; fx.font = 'bold 9px "Noto Sans TC", sans-serif';
  fx.textAlign = 'center'; fx.textBaseline = 'middle';
  fx.fillText('你', 0, 2);
  fx.restore();

  fx.textAlign = 'left'; fx.textBaseline = 'alphabetic';
  fx.fillStyle = 'rgba(226,232,240,.9)';
  fx.font = '11.5px "Noto Sans TC", sans-serif';
  fx.fillText(`${FISH.weapon === 'net' ? '🕸️ 網' : '🤏 單抓（拉扯）'}　捕獲率 ${Math.round(T.fish.catchRate * stateMul() * 100)}%／魚群 ${Math.round(T.fish.catchRateGlow * stateMul() * 100)}%　狀態：${STATE_NAME[T.fish.stateMode]}`, 10, H - 12);
}

function catchFish(f) {
  f.dead = true;
  const before = S.winSum;
  catchPay(f);
  FISH.gained += S.winSum - before;
}

function catchPay(f) {
  if (f.shun) {
    S.pendingShun = { type: f.type, stake: f.tier, forRound: S.round + 1 };
    log(`✨ 撈到特殊壽司魚 ${SUSHI[f.type].name}（押 ${f.tier}）→ 第 ${S.round + 1} 局可押特殊壽司`);
    notice(`✨ 撈到特殊壽司魚（押 ${f.tier}）`, true);
    return;
  }
  const need = neededTypes();
  if (need.has(f.type)) {
    S.hitTypes.add(f.type); S.hitCount[f.type] = (S.hitCount[f.type] || 0) + 1;
    log(`🎣 撈到 ${SUSHI[f.type].emoji}${SUSHI[f.type].name} → 補齊盤上缺的種類`);
    notice(`🎣 補齊 ${SUSHI[f.type].name}！`, true);
    S.plates.forEach(p => payIfComplete(p, '（漁補齊）'));
  } else {
    const w = addWin(f.value);
    log(`🎣 撈到 ${SUSHI[f.type].emoji}${SUSHI[f.type].name} +${w} 枚`);
  }
}

fcv.onclick = e => {
  if (S.phase !== 'FISH' || FISH.over) return;   // 轉場中不接受操作
  const r = fcv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (GW / r.width);
  const y = (e.clientY - r.top) * (GH / r.height);
  const d = Math.hypot(x - CX, y - CY);
  const ang = Math.atan2(y - CY, x - CX);
  if (d > R_SEA) return;                          // 點在漁場外
  if (!inReach(ang)) { notice('太遠了 — 只撈得到自己面前那一區'); refreshAll(); return; }
  const now = performance.now();

  if (FISH.weapon === 'grab') {
    if (FISH.hook) return;                        // 已經在拉一隻了
    let best = null, bestD = 1e9;
    FISH.list.forEach(f => {
      if (f.dead || !inReach(f.ang)) return;
      const [fxp, fyp] = fishXY(f);
      const dd = Math.hypot(fxp - x, fyp - y);
      if (dd <= f.r + 18 && dd < bestD) { bestD = dd; best = f; }
    });
    FISH.ripple = { x, y, rad: 22, t0: now };
    if (!best) {                                  // 空鉤也要錢
      if (S.balance < T.fish.grabCost) { notice('餘額不足'); return; }
      S.balance -= T.fish.grabCost; S.betSum += T.fish.grabCost;
      S.totalBet += T.fish.grabCost; FISH.spent += T.fish.grabCost;
      log(`沒勾到（-${T.fish.grabCost} 枚）`);
      refreshAll(); return;
    }
    startTug(best, now);                          // 勾住 → 開始拉扯
    notice(`勾到 ${SUSHI[best.type].name}！拉扯中，每 ${(T.fish.tugMs / 1000).toFixed(1)} 秒扣 ${T.fish.grabCost} 枚`, true);
    refreshAll();
    return;
  }

  // 網：一次判定，範圍內全撈
  const cost = T.fish.netCost;
  if (S.balance < cost) { notice('餘額不足，撈不動了'); return; }
  S.balance -= cost; S.betSum += cost; S.totalBet += cost; FISH.spent += cost;
  const rad = T.fish.netRadius;
  FISH.ripple = { x, y, rad, t0: now };
  const hits = FISH.list.filter(f => {
    if (f.dead || !inReach(f.ang)) return false;
    const [fxp, fyp] = fishXY(f);
    return Math.hypot(fxp - x, fyp - y) <= rad + f.r;
  });
  if (!hits.length) { log(`網空了（-${cost} 枚）`); notice(`網空了（-${cost} 枚）`); refreshAll(); return; }
  let got = 0, miss = 0;
  hits.forEach(f => {
    if (Math.random() < catchChance(f)) { catchFish(f); got++; }
    else { spook(f, now); miss++; }
  });
  if (!got) { log(`一隻都沒撈到（-${cost} 枚）`); notice(`一隻都沒撈到（-${cost} 枚）`); }
  else if (miss) log(`撈到 ${got} 隻，跑掉 ${miss} 隻`);
  refreshAll();
};
$('wNet').onclick = () => { FISH.weapon = 'net'; refreshAll(); };
$('wGrab').onclick = () => { FISH.weapon = 'grab'; refreshAll(); };
$('fishEnd').onclick = () => { if (S.phase === 'FISH') endFishing(); };

function endFishing() {
  if (S.phase !== 'FISH' || FISH.over) return;
  FISH.over = true; FISH.hook = null;
  if (FISH.raf) cancelAnimationFrame(FISH.raf);
  FISH.raf = null;
  const net = FISH.gained - FISH.spent;
  log(`漁結束：投入 ${fmt(FISH.spent)}／回收 ${fmt(FISH.gained)} → ${net >= 0 ? '+' : ''}${fmt(net)} 枚`);
  bannerFx('漁結束', `投入 ${fmt(FISH.spent)}　回收 ${fmt(FISH.gained)}　${net >= 0 ? '+' : ''}${fmt(net)} 枚`,
    'sea', T.rhythm.fishFx, () => {
      $('stage').classList.remove('fishing');
      finishRound();
    });
}

/* ============ 美術：程式化向量壽司 ============
   不使用競品素材，也不外掛圖檔。每種壽司用「形制 + 配色 + 表面處理」組出來，
   在 100x100 的座標系裡畫（中心 0,0），呼叫端自己 translate/scale。            */
const ART = {
  0:  { form: 'nigiri', top: '#c0202f', edge: '#7f1020', finish: 'sinew',  label: '鮪魚' },
  1:  { form: 'nigiri', top: '#f7cf4a', edge: '#c99a12', finish: 'strap',  label: '玉子' },
  2:  { form: 'nigiri', top: '#f4813c', edge: '#c25617', finish: 'stripe', label: '鮭魚' },
  3:  { form: 'nigiri', top: '#f79bb0', edge: '#c9576f', finish: 'shrimp', label: '甜蝦' },
  4:  { form: 'nigiri', top: '#eef2f6', edge: '#a9b6c4', finish: 'score',  label: '花枝' },
  5:  { form: 'gunkan', top: '#f0a02a', edge: '#b46b0c', finish: 'roe',    label: '海膽' },
  6:  { form: 'gunkan', top: '#f0552f', edge: '#a82d12', finish: 'roe',    label: '鮭卵' },
  7:  { form: 'nigiri', top: '#7b4a22', edge: '#4a2a10', finish: 'glaze',  label: '星鰻' },
  8:  { form: 'maki',   top: '#4caf50', edge: '#2e7d32', finish: 'plain',  label: '河童卷' },
  9:  { form: 'nigiri', top: '#f6ead2', edge: '#c4b391', finish: 'fan',    label: '干貝' },
  10: { form: 'nigiri', top: '#f7a8bb', edge: '#cf7288', finish: 'marble', label: '大腹' },
  11: { form: 'nigiri', top: '#f26b3a', edge: '#b03d15', finish: 'bar',    label: '螃蟹' },
};

function riceBase(c) {
  const g = c.createLinearGradient(0, 4, 0, 34);
  g.addColorStop(0, '#fffdf6'); g.addColorStop(1, '#e2d9c3');
  c.fillStyle = g;
  roundRect(c, -35, 2, 70, 30, 14); c.fill();
  c.strokeStyle = '#cdc3a8'; c.lineWidth = 1.5; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.75)';
  for (let i = 0; i < 7; i++) {
    c.beginPath();
    c.ellipse(-26 + i * 9, 12 + (i % 2) * 9, 4.2, 2.8, i * 0.7, 0, 6.28); c.fill();
  }
}
// 把 #rrggbb 調亮(正)或調暗(負)
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(amt > 0 ? v + (255 - v) * amt : v * (1 + amt))));
  return '#' + [f(n >> 16 & 255), f(n >> 8 & 255), f(n & 255)]
    .map(v => v.toString(16).padStart(2, '0')).join('');
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawSushi(c, type) {
  const a = ART[type] || ART[0];
  c.save();
  c.lineJoin = 'round';

  if (a.form === 'maki') {
    c.beginPath(); c.arc(0, 4, 37, 0, 6.28);
    const g = c.createRadialGradient(-10, -8, 4, 0, 4, 37);
    g.addColorStop(0, '#3f4a52'); g.addColorStop(1, '#1a2026');
    c.fillStyle = g; c.fill();
    c.beginPath(); c.arc(0, 4, 28, 0, 6.28);
    c.fillStyle = '#f7f1e0'; c.fill();
    c.fillStyle = 'rgba(255,255,255,.6)';
    for (let i = 0; i < 10; i++) {
      const an = i * 0.628, rr = 17 + (i % 3) * 3;
      c.beginPath(); c.ellipse(Math.cos(an) * rr, 4 + Math.sin(an) * rr, 4, 2.6, an, 0, 6.28); c.fill();
    }
    c.beginPath(); c.arc(0, 4, 13, 0, 6.28);
    const g2 = c.createRadialGradient(-4, 0, 2, 0, 4, 13);
    g2.addColorStop(0, '#8fd694'); g2.addColorStop(1, a.top);
    c.fillStyle = g2; c.fill();
    c.strokeStyle = a.edge; c.lineWidth = 1.5; c.stroke();
    c.restore(); return;
  }

  if (a.form === 'gunkan') {
    // 軍艦：海苔圍邊 + 飯 + 顆粒狀配料
    roundRect(c, -32, -6, 64, 42, 8);
    const gn = c.createLinearGradient(0, -6, 0, 36);
    gn.addColorStop(0, '#2b333b'); gn.addColorStop(1, '#141a1f');
    c.fillStyle = gn; c.fill();
    c.strokeStyle = 'rgba(255,255,255,.10)'; c.lineWidth = 1;
    for (let i = -26; i < 30; i += 7) { c.beginPath(); c.moveTo(i, -5); c.lineTo(i + 3, 35); c.stroke(); }
    c.fillStyle = '#f7f1e0';
    roundRect(c, -27, 14, 54, 19, 7); c.fill();
    // 配料顆粒
    const rows = [[-22, -8, 7], [-12, -13, 8], [0, -15, 8], [12, -13, 8], [22, -8, 7]];
    rows.forEach(([x, y, r]) => {
      for (let k = 0; k < 3; k++) {
        const px = x + (k - 1) * 5.5, py = y + Math.abs(k - 1) * 4 + 6;
        const g = c.createRadialGradient(px - 2, py - 2, 1, px, py, r);
        g.addColorStop(0, '#fff3d0'); g.addColorStop(0.35, a.top); g.addColorStop(1, a.edge);
        c.fillStyle = g;
        c.beginPath(); c.arc(px, py, r * 0.62, 0, 6.28); c.fill();
      }
    });
    c.restore(); return;
  }

  // 握壽司
  riceBase(c);
  c.save();
  c.rotate(-0.05);
  roundRect(c, -39, -24, 78, 36, 13);
  const g = c.createLinearGradient(0, -24, 0, 12);
  g.addColorStop(0, a.top); g.addColorStop(1, a.edge);
  c.fillStyle = g; c.fill();
  c.strokeStyle = a.edge; c.lineWidth = 1.5; c.stroke();

  c.save();
  roundRect(c, -39, -24, 78, 36, 13); c.clip();
  if (a.finish === 'stripe') {
    c.strokeStyle = 'rgba(255,255,255,.72)'; c.lineWidth = 5;
    for (let i = -30; i < 40; i += 16) { c.beginPath(); c.moveTo(i, -26); c.lineTo(i - 12, 14); c.stroke(); }
  } else if (a.finish === 'sinew') {
    c.strokeStyle = 'rgba(255,255,255,.30)'; c.lineWidth = 2.5;
    for (let i = -28; i < 40; i += 14) { c.beginPath(); c.moveTo(i, -26); c.lineTo(i - 8, 14); c.stroke(); }
  } else if (a.finish === 'marble') {
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 3.5;
    [-22, -6, 10, 24].forEach(x => {
      c.beginPath(); c.moveTo(x, -26);
      c.bezierCurveTo(x - 10, -12, x + 6, 0, x - 6, 14); c.stroke();
    });
  } else if (a.finish === 'bar') {
    c.fillStyle = '#fff6ee';
    for (let i = -34; i < 40; i += 18) { c.fillRect(i, -26, 8, 42); }
  } else if (a.finish === 'score') {
    c.strokeStyle = 'rgba(150,170,190,.6)'; c.lineWidth = 2;
    for (let i = -28; i < 36; i += 11) { c.beginPath(); c.moveTo(i, -24); c.lineTo(i + 8, 12); c.stroke(); }
  } else if (a.finish === 'fan') {
    c.strokeStyle = 'rgba(190,170,130,.75)'; c.lineWidth = 2;
    for (let i = 0; i < 7; i++) {
      c.beginPath(); c.moveTo(0, 12);
      c.lineTo(-34 + i * 11, -24); c.stroke();
    }
  } else if (a.finish === 'shrimp') {
    c.strokeStyle = '#fff'; c.lineWidth = 3;
    for (let i = -26; i < 34; i += 12) {
      c.beginPath(); c.arc(i, -6, 13, Math.PI * 0.05, Math.PI * 0.95); c.stroke();
    }
  } else if (a.finish === 'glaze') {
    const gl = c.createLinearGradient(0, -24, 0, 12);
    gl.addColorStop(0, 'rgba(255,220,150,.55)'); gl.addColorStop(.5, 'rgba(255,255,255,0)');
    c.fillStyle = gl; c.fillRect(-40, -24, 80, 36);
  }
  // 共用高光
  const hl = c.createLinearGradient(-20, -24, 10, -2);
  hl.addColorStop(0, 'rgba(255,255,255,.45)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = hl; c.fillRect(-40, -24, 80, 20);
  c.restore();
  c.restore();

  if (a.finish === 'strap') {   // 玉子的海苔帶
    c.fillStyle = '#1f262c';
    roundRect(c, -41, -8, 82, 13, 3); c.fill();
    c.fillStyle = 'rgba(255,255,255,.12)';
    roundRect(c, -41, -8, 82, 4, 2); c.fill();
  }
  c.restore();
}

// 快取成小圖，給 HTML 的 chip / 按鈕用
const ICON_CACHE = {};
function sushiIcon(type, size) {
  const key = type + '@' + size;
  if (ICON_CACHE[key]) return ICON_CACHE[key];
  const c2 = document.createElement('canvas');
  c2.width = c2.height = size;
  const c = c2.getContext('2d');
  c.translate(size / 2, size / 2);
  c.scale(size / 104, size / 104);
  drawSushi(c, type);
  return (ICON_CACHE[key] = c2.toDataURL());
}
function iconTag(type, size) {
  return `<img src="${sushiIcon(type, size || 26)}" width="${size || 26}" height="${size || 26}" style="vertical-align:middle;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))">`;
}

/* 魚：身體會波浪擺動 + 尾巴甩動 + 轉向 + 背上的壽司 */
function drawFishShape(c, x, y, r, dir, type, t, opt) {
  opt = opt || {};
  const a = ART[type] || ART[0];
  const ph = t / 125 + x * 0.05;
  const wob = Math.sin(ph) * 0.35;
  c.save();
  c.translate(x, y);
  c.scale(dir, 1);
  // 尾巴（相位落後身體，看起來像在推水）
  c.save(); c.rotate(Math.sin(ph - 0.9) * 0.42);
  c.beginPath();
  c.moveTo(-r * 1.15, 0);
  c.lineTo(-r * 2.05, -r * 0.72);
  c.quadraticCurveTo(-r * 1.5, 0, -r * 2.05, r * 0.72);
  c.closePath();
  c.fillStyle = opt.gold ? '#f6c141' : a.edge; c.fill();
  c.restore();
  // 背鰭
  c.beginPath();
  c.moveTo(-r * 0.2, -r * 0.82);
  c.quadraticCurveTo(r * 0.1, -r * 1.55, r * 0.55, -r * 0.7);
  c.closePath();
  c.fillStyle = opt.gold ? '#e0a92c' : a.edge; c.fill();
  // 身體：用兩條貝茲曲線組出會波動的魚身，而不是固定的橢圓
  const bend = Math.sin(ph) * r * 0.22;
  c.beginPath();
  c.moveTo(r * 1.5, 0);
  c.bezierCurveTo(r * 0.7, -r * 0.95, -r * 0.4, -r * 0.9 + bend, -r * 1.15, bend * 1.4);
  c.bezierCurveTo(-r * 0.4, r * 0.9 + bend, r * 0.7, r * 0.95, r * 1.5, 0);
  c.closePath();
  const g = c.createLinearGradient(0, -r, 0, r);
  if (opt.gold) { g.addColorStop(0, '#ffe9a3'); g.addColorStop(.55, '#f6c141'); g.addColorStop(1, '#c98c12'); }
  else { g.addColorStop(0, '#dbe9f4'); g.addColorStop(.5, a.top); g.addColorStop(1, a.edge); }
  c.fillStyle = g; c.fill();
  c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1.5; c.stroke();
  // 腹部亮面
  c.beginPath(); c.ellipse(r * 0.1, r * 0.34, r * 1.05, r * 0.4, 0, 0, 6.28);
  c.fillStyle = 'rgba(255,255,255,.35)'; c.fill();
  // 胸鰭
  c.beginPath();
  c.moveTo(r * 0.15, r * 0.15);
  c.quadraticCurveTo(-r * 0.25, r * 0.95, r * 0.6, r * 0.5);
  c.closePath(); c.fillStyle = 'rgba(255,255,255,.45)'; c.fill();
  // 眼睛
  c.beginPath(); c.arc(r * 0.92, -r * 0.2, r * 0.24, 0, 6.28);
  c.fillStyle = '#fff'; c.fill();
  c.beginPath(); c.arc(r * 0.98, -r * 0.2, r * 0.12, 0, 6.28);
  c.fillStyle = '#111'; c.fill();
  c.restore();

  // 背上的壽司（不隨方向鏡射，避免形狀反過來；刻意畫小一點，讓魚身看得見）
  c.save();
  c.translate(x, y - r * 0.95);
  const s = r * 0.023;
  c.scale(s, s);
  drawSushi(c, type);
  c.restore();
}

/* ============ 繪製輪盤 ============ */
/* 遊戲座標一律用 574×574；畫布本身是 1.5 倍（861）以避免放大後糊掉，
   每次繪製前把 context 縮放回遊戲座標，其他程式碼都不用改。 */
const GW = 574, GH = 574, HD = 1.5;
const cv = $('wheel'), cx = cv.getContext('2d');
const CX = 287, CY = 287;
/* 輪盤有兩種大小：押注時縮小、外圈跑迴轉帶；抽選開始就把迴轉帶收掉、輪盤放大到滿版。
   S.wheelK 0→1 之間補間，所有半徑跟著變。 */
const WS = { out: 222, in: 122, ball: 190, icon: 186, name: 148 };   // 小（有迴轉帶）
const WB = { out: 274, in: 150, ball: 234, icon: 230, name: 182 };   // 大（滿版）
let R_OUT = WS.out, R_IN = WS.in, R_BALL = WS.ball, R_ICON = WS.icon, R_NAME = WS.name;
function applyWheelScale() {
  const k = S.wheelK;
  const L = (a, b) => a + (b - a) * k;
  R_OUT = L(WS.out, WB.out); R_IN = L(WS.in, WB.in); R_BALL = L(WS.ball, WB.ball);
  R_ICON = L(WS.icon, WB.icon); R_NAME = L(WS.name, WB.name);
}
const BELT_IN = 230, BELT_OUT = 284, BELT_R = 257, BELT_PR = 27;   // 外圈迴轉帶
// 輪盤是「一直在轉」的：pocketAngleLocal 是格子在盤上的固定角度，
// pocketAngle 是它此刻在螢幕上的角度（＝盤面角度 + 自轉量）。
// 飛行中的球一律用 local 座標算，畫的時候才加上 wheelRot，球才會跟著盤子走。
function pocketAngleLocal(i) { return -Math.PI / 2 + (i + 0.5) * (Math.PI * 2 / 16); }
function pocketAngle(i) { return pocketAngleLocal(i) + S.wheelRot; }
function stepWheel(now) {
  if (!S.rotT) S.rotT = now;
  const dt = Math.max(0, Math.min(0.1, (now - S.rotT) / 1000));   // 分頁切回來時不要一次跳一大段，也不倒退
  S.rotT = now;
  S.wheelRot = (S.wheelRot + dt * T.rhythm.wheelSpin * Math.PI / 180) % (Math.PI * 2);
  BELT.rot = (BELT.rot + dt * T.rhythm.beltSpin * Math.PI / 180) % (Math.PI * 2);
  if (S.wheelK !== S.wheelKT) {
    const sp = Math.min(1, dt * 4.5);
    S.wheelK += (S.wheelKT - S.wheelK) * sp;
    if (Math.abs(S.wheelKT - S.wheelK) < 0.002) S.wheelK = S.wheelKT;
  }
  applyWheelScale();
}
function beltAngle(i) {
  return -Math.PI / 2 + BELT.rot + i * (Math.PI * 2 / Math.max(1, BELT.list.length));
}

function draw() {
  if (S.pockets.length !== 16) return;     // 盤面還沒生成就別畫（第一幀防呆）
  const now = performance.now();
  cx.setTransform(HD, 0, 0, HD, 0, 0);
  cx.clearRect(0, 0, GW, GH);
  // 外圈：檯面木紋感 + 內陰影
  const og = cx.createRadialGradient(CX, CY - 60, 60, CX, CY, R_OUT + 20);
  og.addColorStop(0, '#1b2740'); og.addColorStop(1, '#080d18');
  cx.fillStyle = og;
  cx.beginPath(); cx.arc(CX, CY, R_OUT + 16, 0, Math.PI * 2); cx.fill();
  cx.beginPath(); cx.arc(CX, CY, R_OUT + 6, 0, Math.PI * 2);
  cx.strokeStyle = '#3b4a68'; cx.lineWidth = 6; cx.stroke();
  cx.beginPath(); cx.arc(CX, CY, R_OUT + 6, 0, Math.PI * 2);
  cx.strokeStyle = 'rgba(251,191,36,.25)'; cx.lineWidth = 2; cx.stroke();

  if (S.wheelK < 0.995) { cx.save(); cx.globalAlpha = 1 - S.wheelK; drawBeltTrack(); cx.restore(); }

  const seg = Math.PI * 2 / 16;
  for (let i = 0; i < 16; i++) {
    const a0 = -Math.PI / 2 + i * seg + S.wheelRot, a1 = a0 + seg;
    const t = S.pockets[i];
    let spItem = S.spItems ? S.spItems[i] : null;      // 特別輪盤模式
    let revealing = false;
    if (spItem && FX.spReveal) {                      // 逐格翻開的轉場
      const at = FX.spReveal + 80 + Math.max(0, S.spFree.indexOf(i)) * 80;
      if (now < at) spItem = null;
      else if (now < at + 220) revealing = true;
    }
    const isSP = t === SP_POCKET;
    const hit = S.balls.includes(i);

    cx.beginPath();
    cx.moveTo(CX + Math.cos(a0) * R_IN, CY + Math.sin(a0) * R_IN);
    cx.arc(CX, CY, R_OUT, a0, a1);
    cx.lineTo(CX + Math.cos(a1) * R_IN, CY + Math.sin(a1) * R_IN);
    cx.arc(CX, CY, R_IN, a1, a0, true);
    cx.closePath();
    // 底色：由內往外的漸層，讓格子有厚度
    const gm = cx.createRadialGradient(CX, CY, R_IN, CX, CY, R_OUT);
    if (spItem) {
      gm.addColorStop(0, SP_ITEMS[spItem].color); gm.addColorStop(1, shade(SP_ITEMS[spItem].color, -0.45));
    } else if (isSP) {
      gm.addColorStop(0, '#c084fc'); gm.addColorStop(1, '#4c1d95');
    } else {
      const base = ART[t] ? ART[t].top : '#64748b';
      gm.addColorStop(0, shade(base, 0.16)); gm.addColorStop(1, shade(base, -0.55));
    }
    cx.fillStyle = gm;
    cx.globalAlpha = hit ? 0.3 : 1;      // 已有球的格子壓暗（＝灰格）
    cx.fill();
    cx.globalAlpha = 1;
    if (revealing) {                     // 剛翻開的格子閃一下金光
      cx.fillStyle = 'rgba(255,245,205,.75)'; cx.fill();
    }
    cx.strokeStyle = 'rgba(8,13,24,.9)'; cx.lineWidth = 3; cx.stroke();

    const am = a0 + seg / 2;
    const alpha = hit ? 0.35 : 1;
    // 壽司圖：跟著扇形轉（像迴轉帶上的盤子）
    cx.save();
    cx.globalAlpha = alpha;
    cx.translate(CX + Math.cos(am) * R_ICON, CY + Math.sin(am) * R_ICON);
    cx.rotate(am + Math.PI / 2 + (Math.sin(am) > 0 ? Math.PI : 0));
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    if (spItem || isSP) {
      cx.font = '26px serif';
      cx.fillText(spItem ? SP_ITEMS[spItem].emoji : '🎴', 0, 0);
    } else {
      cx.save(); cx.scale(0.42, 0.42); drawSushi(cx, t); cx.restore();
    }
    cx.restore();
    // 名稱：永遠水平，深色藥丸底，任何底色都讀得清
    cx.save();
    cx.globalAlpha = alpha;
    cx.translate(CX + Math.cos(am) * R_NAME, CY + Math.sin(am) * R_NAME);
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    const nm = spItem ? SP_ITEMS[spItem].label : (isSP ? '老闆SP' : ART[t].label);
    cx.font = 'bold 11.5px "Noto Sans TC", sans-serif';
    const w = cx.measureText(nm).width + 13;
    cx.fillStyle = 'rgba(6,10,20,.8)';
    roundRect(cx, -w / 2, -9.5, w, 19, 9); cx.fill();
    cx.strokeStyle = 'rgba(255,255,255,.10)'; cx.lineWidth = 1; cx.stroke();
    cx.fillStyle = spItem || isSP ? '#fde68a' : '#f1f5f9';
    cx.fillText(nm, 0, 0.5);
    // 稀有度：只佔 1 格的種類加★
    if (!spItem && !isSP && S.counts[t] === 1) {
      cx.fillStyle = '#fbbf24'; cx.font = 'bold 10.5px sans-serif';
      cx.fillText('★', w / 2 + 6, 0);
    }
    cx.restore();
  }

  // 中央：玻璃感圓盤
  const cg = cx.createRadialGradient(CX - 40, CY - 50, 10, CX, CY, R_IN);
  cg.addColorStop(0, '#22314f'); cg.addColorStop(1, '#0a1120');
  cx.beginPath(); cx.arc(CX, CY, R_IN - 4, 0, Math.PI * 2);
  cx.fillStyle = cg; cx.fill();
  cx.strokeStyle = '#3b4a68'; cx.lineWidth = 3; cx.stroke();
  cx.beginPath(); cx.arc(CX, CY, R_IN - 12, 0, Math.PI * 2);
  cx.strokeStyle = 'rgba(251,191,36,.18)'; cx.lineWidth = 1; cx.stroke();
  // 上緣反光
  cx.save();
  cx.beginPath(); cx.arc(CX, CY, R_IN - 6, Math.PI * 1.08, Math.PI * 1.92); cx.clip();
  const sg = cx.createLinearGradient(0, CY - R_IN, 0, CY);
  sg.addColorStop(0, 'rgba(255,255,255,.10)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  cx.fillStyle = sg; cx.fillRect(CX - R_IN, CY - R_IN, R_IN * 2, R_IN); cx.restore();
  cx.textAlign = 'center'; cx.fillStyle = '#7dd3fc';
  cx.font = 'bold 15px sans-serif';
  cx.fillText(`第 ${S.round} 局`, CX, CY - 30);
  const betting = S.phase === 'BET';
  const secs = betLeft();
  cx.font = 'bold 34px sans-serif';
  cx.fillStyle = betting && secs <= 5 ? '#f87171' : '#fbbf24';
  cx.fillText(betting ? secs.toFixed(1) : `${S.balls.length} / 5`, CX, CY + 8);
  cx.font = '11px sans-serif'; cx.fillStyle = '#64748b';
  cx.fillText(betting ? '押注剩餘（秒）' : '球數', CX, CY + 26);
  if (S.phase === 'FREE') { cx.fillStyle = '#f0abfc'; cx.font = 'bold 13px sans-serif'; cx.fillText('FREE CHOICE', CX, CY + 52); }

  // 球：立體感（陰影 + 高光）
  const ball = (x, y, r, c1, c2, label, lc) => {
    cx.beginPath(); cx.ellipse(x + 2, y + 4, r * 0.95, r * 0.55, 0, 0, 6.28);
    cx.fillStyle = 'rgba(0,0,0,.4)'; cx.fill();
    const g = cx.createRadialGradient(x - r * .4, y - r * .5, r * .15, x, y, r);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    cx.beginPath(); cx.arc(x, y, r, 0, 6.28);
    cx.fillStyle = g; cx.fill();
    cx.strokeStyle = 'rgba(8,13,24,.85)'; cx.lineWidth = 2; cx.stroke();
    if (label) {
      cx.fillStyle = lc; cx.font = 'bold 11px sans-serif';
      cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.fillText(label, x, y + 1);
    }
  };
  S.balls.forEach((idx, n) => {
    const a = pocketAngle(idx);
    ball(CX + Math.cos(a) * R_BALL, CY + Math.sin(a) * R_BALL, 11, '#ffffff', '#b8c4d4', String(n + 1), '#0b1120');
  });

  // 飛行中的球（帶殘影）
  if (S.ballAnim && S.ballAnim.cur != null) {
    const a = S.ballAnim.cur + S.wheelRot;
    for (let k = 4; k >= 1; k--) {
      const aa = a + k * 0.055;
      cx.globalAlpha = 0.1 * (5 - k);
      cx.beginPath(); cx.arc(CX + Math.cos(aa) * R_BALL, CY + Math.sin(aa) * R_BALL, 9 - k, 0, 6.28);
      cx.fillStyle = '#fde68a'; cx.fill();
    }
    cx.globalAlpha = 1;
    ball(CX + Math.cos(a) * R_BALL, CY + Math.sin(a) * R_BALL, 11, '#fffbea', '#eab308');
  }

  // 第 6 顆 EX 球（金色，較大，落定後發光）
  if (S.exBall && S.exBall.cur != null) {
    const a = (S.exBall.landed ? S.exBall.to : S.exBall.cur) + S.wheelRot;
    const x = CX + Math.cos(a) * R_BALL, y = CY + Math.sin(a) * R_BALL;
    if (S.exBall.landed) {
      const pulse = 18 + Math.sin(now / 180) * 6;
      const g = cx.createRadialGradient(x, y, 4, x, y, pulse + 14);
      g.addColorStop(0, 'rgba(251,191,36,.55)'); g.addColorStop(1, 'rgba(251,191,36,0)');
      cx.fillStyle = g;
      cx.beginPath(); cx.arc(x, y, pulse + 14, 0, 6.28); cx.fill();
    }
    ball(x, y, 14, '#fff7d6', '#d97706', 'EX', '#431407');
  }

  if (S.wheelK < 0.995) { cx.save(); cx.globalAlpha = 1 - S.wheelK; drawBeltPlates(now); cx.restore(); }
  drawExpandFx(now);
  drawFX(now);
}

/* 輪盤放大時的衝擊波，讓切換不會很突兀 */
function drawExpandFx(now) {
  if (!FX.expand) return;
  const k = (now - FX.expand) / 700;
  if (k >= 1) { FX.expand = 0; return; }
  const r = WS.out + (WB.out + 40 - WS.out) * k;
  cx.save();
  cx.globalAlpha = (1 - k) * 0.9;
  cx.strokeStyle = '#fde68a'; cx.lineWidth = 6 * (1 - k) + 1;
  cx.beginPath(); cx.arc(CX, CY, r, 0, 6.28); cx.stroke();
  cx.globalAlpha = (1 - k) * 0.35;
  cx.strokeStyle = '#7dd3fc'; cx.lineWidth = 2;
  cx.beginPath(); cx.arc(CX, CY, r * 0.92, 0, 6.28); cx.stroke();
  cx.restore();
}

/* ============ 外圈迴轉帶 ============ */
function drawBeltTrack() {
  // 檯面：深木色環＋內外緣高光，像壽司店的輸送帶
  cx.save();
  cx.beginPath(); cx.arc(CX, CY, BELT_OUT, 0, 6.28);
  cx.arc(CX, CY, BELT_IN, 0, 6.28, true);
  const g = cx.createRadialGradient(CX, CY, BELT_IN, CX, CY, BELT_OUT);
  g.addColorStop(0, '#3a2a1c'); g.addColorStop(.5, '#573b25'); g.addColorStop(1, '#2a1a10');
  cx.fillStyle = g; cx.fill('evenodd');
  cx.restore();
  cx.beginPath(); cx.arc(CX, CY, BELT_OUT - 1, 0, 6.28);
  cx.strokeStyle = 'rgba(255,220,160,.22)'; cx.lineWidth = 2; cx.stroke();
  cx.beginPath(); cx.arc(CX, CY, BELT_IN + 1, 0, 6.28);
  cx.strokeStyle = 'rgba(0,0,0,.55)'; cx.lineWidth = 2; cx.stroke();
  // 輸送帶的節板：跟著帶子一起走
  cx.save();
  cx.strokeStyle = 'rgba(0,0,0,.28)'; cx.lineWidth = 1.5;
  for (let i = 0; i < 48; i++) {
    const a = BELT.rot * 1 + i * (Math.PI * 2 / 48);
    cx.beginPath();
    cx.moveTo(CX + Math.cos(a) * (BELT_IN + 2), CY + Math.sin(a) * (BELT_IN + 2));
    cx.lineTo(CX + Math.cos(a) * (BELT_OUT - 2), CY + Math.sin(a) * (BELT_OUT - 2));
    cx.stroke();
  }
  cx.restore();
}

const BELT_CLR = {
  maru: ['#f6f8fc', '#b9c3d4', '#8f9bb0'],
  geta: ['#ffd9d3', '#d3796a', '#b4645a'],
  funa: ['#ffe9ae', '#cb9c37', '#a97f22'],
};
function drawBeltPlates(now) {
  BELT.list.forEach((c, i) => {
    const a = beltAngle(i);
    const x = CX + Math.cos(a) * BELT_R, y = CY + Math.sin(a) * BELT_R;
    const on = BELT.sel === i;
    const clr = BELT_CLR[c.kind] || BELT_CLR.maru;
    cx.save();
    cx.translate(x, y);
    // 盤子（碟身＋碟緣），微微傾斜跟著帶子走
    cx.rotate(a + Math.PI / 2);
    cx.beginPath(); cx.ellipse(1, 3, BELT_PR, BELT_PR * .82, 0, 0, 6.28);
    cx.fillStyle = 'rgba(0,0,0,.45)'; cx.fill();
    const pg = cx.createLinearGradient(0, -BELT_PR, 0, BELT_PR);
    pg.addColorStop(0, clr[0]); pg.addColorStop(1, clr[1]);
    cx.beginPath(); cx.ellipse(0, 0, BELT_PR, BELT_PR * .82, 0, 0, 6.28);
    cx.fillStyle = pg; cx.fill();
    cx.strokeStyle = on ? '#6ee0a4' : clr[2]; cx.lineWidth = on ? 3 : 1.6; cx.stroke();
    if (on) { cx.shadowColor = 'rgba(110,224,164,.9)'; cx.shadowBlur = 14; cx.stroke(); cx.shadowBlur = 0; }
    cx.restore();
    // 盤上的壽司：永遠正立，看得清楚
    cx.save();
    cx.translate(x, y);
    const k = c.types.length;
    const isz = k >= 5 ? 12 : k >= 3 ? 15 : 20;
    const cols = k >= 5 ? 3 : k;
    const rows = Math.ceil(k / cols);
    c.types.forEach((t, j) => {
      const r0 = Math.floor(j / cols), c0 = j % cols;
      const cnt = Math.min(cols, k - r0 * cols);
      const px = (c0 - (cnt - 1) / 2) * (isz + 1);
      const py = (r0 - (rows - 1) / 2) * (isz + 1) - 3;
      cx.save();
      cx.translate(px, py); cx.scale(isz / 104, isz / 104);
      drawSushi(cx, t);                 // 直接畫向量，不走 dataURL（比較清楚也不用等載入）
      cx.restore();
    });
    // 盤型 ＋ 這盤的 BINGO得分
    cx.font = 'bold 9px "Noto Sans TC", sans-serif';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillStyle = 'rgba(10,15,30,.78)';
    const lb = `${KIND_NAME[c.kind]} ${fmt(c.per || 0)}`;
    const w = cx.measureText(lb).width + 8;
    roundRect(cx, -w / 2, BELT_PR * .82 - 12, w, 11, 5); cx.fill();
    cx.fillStyle = '#fff';
    cx.fillText(lb, 0, BELT_PR * .82 - 6.5);
    cx.restore();
  });
}

/* 點迴轉帶上的盤子 */
cv.onclick = e => {
  if (S.phase !== 'BET' || !BELT.list.length || S.wheelK > 0.5) return;
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (GW / r.width);
  const y = (e.clientY - r.top) * (GH / r.height);
  let best = -1, bestD = 1e9;
  BELT.list.forEach((c, i) => {
    const a = beltAngle(i);
    const d = Math.hypot(CX + Math.cos(a) * BELT_R - x, CY + Math.sin(a) * BELT_R - y);
    if (d < bestD) { bestD = d; best = i; }
  });
  if (best >= 0 && bestD <= BELT_PR + 6) pickBelt(best);
};

/* ============ UI 更新 ============ */
const PHASE_NAME = { BET: '押注中', DRAW: '抽球中', FREE: 'FREE CHOICE', SP: '老闆SP', FISH: '漁', SETTLE: '結算完成' };
const fmt = n => Math.round(n).toLocaleString('en-US');

/* ============ 印章卡（スタンプカード）============
   [攻略] 押注累積印章：5 個 → 老闆SP 可押布丁、10 個 → 可押 JP。 */
function renderStamps() {
  const need = T.sp.stampJP;
  $('stampNum').textContent = `${S.stamps} / ${need}`;
  const dots = $('stampDots');
  if (dots.children.length !== need) {
    dots.innerHTML = '';
    for (let i = 0; i < need; i++) {
      const d = document.createElement('i');
      if (i + 1 === T.sp.stampPurin || i + 1 === need) d.className = 'key';
      dots.appendChild(d);
    }
  }
  [...dots.children].forEach((d, i) => d.classList.toggle('on', i < S.stamps));
  $('stampBar').style.width = Math.min(100, S.stampPot / T.sp.stampPer * 100).toFixed(0) + '%';
  const toPurin = T.sp.stampPurin - S.stamps, toJP = need - S.stamps;
  $('stampNote').innerHTML = S.stamps >= need
    ? '布丁與 <b style="color:#e9b53f">JP</b> 都已解鎖，進老闆SP 就能押'
    : (S.stamps >= T.sp.stampPurin
      ? `布丁已解鎖；JP 還差 <b>${toJP}</b> 個（每 ${T.sp.stampPer} 枚押注 1 個）`
      : `再 <b>${toPurin}</b> 個解鎖布丁、<b>${toJP}</b> 個解鎖 JP（每 ${T.sp.stampPer} 枚押注 1 個）`);

/* ============ 我的座位：依盤數堆起來的壽司盤 ============
   實機是把押注做成一疊實體壽司盤放在自己的位子上，盤子顏色分價位。 */
const PLATE_CLR = { maru: '', geta: 'red', funa: 'gold', shun: 'gold' };
function renderSeat() {
  const box = $('seat');
  const total = S.plates.reduce((a, p) => a + p.count, 0);
  $('seatTotal').textContent = total + ' 盤';
  if (!S.plates.length) {
    box.innerHTML = '<div class="hint" style="margin:6px 0 0">還沒押注 — 選壽司後按「＋1 盤 / ＋10 盤」，盤子會堆在這裡。</div>';
    return;
  }
  box.innerHTML = '';
  const cap = document.createElement('div');
  cap.className = 'hint'; cap.style.margin = '0 0 4px';
  cap.innerHTML = `本局得分上限：押注 ${fmt(S.betSum)} × ${fmt(T.econ.maxWinMul)} ＝ <b>${fmt(roundCap())}</b> 枚`;
  box.appendChild(cap);
  S.plates.forEach(p => {
    const done = p.kind !== 'shun' && plateDone(p);
    const pay = p.kind === 'shun' ? p.per : p.per * p.count;
    const res = p.result == null ? '' :
      (p.result ? `<span class="sh-won">+${fmt(p.result)}</span>` : '<span class="sh-lost">未中</span>');

    const g = document.createElement('div');
    g.className = 'seat-grp';

    // 左：壽司牌（疊在盤子上的那組）＋ 盤型資訊
    const canFree = S.phase === 'FREE' && p.free && !p.freeUsed && !p.result && missingOf(p).length > 0;
    const col = document.createElement('div');
    col.className = 'seat-col';
    col.innerHTML =
      (p.free ? `<div><span class="free-badge${canFree ? ' live' : ''}">${canFree ? 'FREE ↓ 點一貫' : 'FREE'}</span></div>` : '') +
      '<div class="tiles">' + (function () {
        const seen = {};
        return p.types.map(t => {
          const j = (seen[t] = (seen[t] || 0) + 1);      // 這是這種類的第 j 貫
          const hit = haveOf(p, t) >= j;                  // 開到第 j 顆才算這貫中
          const pickable = canFree && !hit;
          return `<span class="tile ${hit ? 'on' : 'off'}${pickable ? ' pick' : ''}" data-t="${t}" title="${SUSHI[t].name}">` +
            iconTag(t, 26) + (p.freeUsed === t && j === haveOf(p, t) ? '<b class="tf">F</b>' : '') + '</span>';
        }).join('');
      })() + '</div>' +
      `<div class="seat-head"><b>${KIND_NAME[p.kind]}</b>×${p.count} 盤　押 ${fmt(p.stake * p.count)}` +
      (p.kind === 'shun' ? '' : `　單盤 ${fmt(p.per)}`) + `${res}</div>`;
    if (canFree) {
      col.querySelectorAll('.tile.pick').forEach(el => {
        el.onclick = () => useFree(p, Number(el.dataset.t));
      });
    }

    // 右：一疊碟子，正面印 BINGO得分
    const st = document.createElement('div');
    st.className = 'stack' + (done ? ' done' : '');
    const shown = Math.min(p.count, 14);            // 疊到 14 片高就不再長高
    st.style.height = Math.max(28, 20 + (shown - 1) * 5) + 'px';
    for (let i = 0; i < shown; i++) {
      const d = document.createElement('div');
      d.className = 'pl ' + (PLATE_CLR[p.kind] || '');
      d.style.bottom = (i * 5) + 'px';
      d.style.left = d.style.right = (i * 0.9) + 'px';   // 越上面越窄＝看起來是一疊有厚度的碟子
      d.style.zIndex = String(i + 1);
      st.appendChild(d);
    }
    const pv = document.createElement('div');
    pv.className = 'pay'; pv.style.zIndex = '99';
    // 疊子上印的是「整疊一起中」的合計（照實機：1972 / 1998 那個數字）
    pv.innerHTML = `<b>${fmt(pay)}</b><i>BINGO得分${p.kind === 'shun' ? '' : `　${fmt(p.per)}×${p.count}`}</i>`;
    st.appendChild(pv);

    g.append(col, st);
    box.appendChild(g);
  });
}

/* 押注倒數（BET）／下一局倒數（SETTLE）：每幀更新，不進 refreshAll 以免整頁重畫 */
function updateCd() {
  const st = $('cdStat'), lb = st.firstElementChild, b = $('betCd');
  if (S.phase === 'BET') {
    const s = betLeft();
    lb.textContent = '押注倒數';
    b.textContent = s.toFixed(s < 10 ? 1 : 0);
    st.classList.toggle('urge', s <= 5);
  } else if (S.phase === 'SETTLE' && S.autoT) {
    lb.textContent = '下一局';
    b.textContent = Math.max(0, (S.nextAt - performance.now()) / 1000).toFixed(1);
    st.classList.remove('urge');
  } else if (S.phase === 'FREE') {
    const s = Math.max(0, (S.freeAt - performance.now()) / 1000);
    lb.textContent = 'FREE 倒數';
    b.textContent = s.toFixed(1);
    st.classList.add('urge');

  } else {
    lb.textContent = '押注倒數'; b.textContent = '—'; st.classList.remove('urge');
  }
}

/* 點本局第 i 貫的某種壽司：
   點還沒選的那貫 → 這種選到 i+1 貫；點已經選的那貫 → 縮回 i 貫。
   同一種可以選多貫＝要開出多顆那種的球。 */
function pickSlot(t, i) {
  if (S.phase !== 'BET') return;
  const max = KIND_SIZE[S.kind][1];
  const cur = S.selected.filter(x => x === t).length;
  const want = i < cur ? i : i + 1;
  if (want > cur) {
    for (let k = 0; k < want - cur; k++) S.selected.push(t);
    while (S.selected.length > max) S.selected.shift();
  } else {
    for (let k = 0; k < cur - want; k++) {
      const idx = S.selected.lastIndexOf(t);
      if (idx >= 0) S.selected.splice(idx, 1);
    }
  }
  BELT.sel = -1;
  refreshAll();
}

document.querySelectorAll('.tab').forEach(tab => {

    if (S.phase !== 'BET') return;
    S.kind = tab.dataset.kind;
    // 換盤型時把選取裁到新盤型的上限，不用重新點
    const max = KIND_SIZE[S.kind][1];
    if (S.selected.length > max) S.selected = S.selected.slice(-max);
    refreshAll();
  };
});
