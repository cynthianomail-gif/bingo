<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迴轉壽司賓果 demo</title>
<style>
  /* ===== 設計系統：和風街機（靛藍 × 檜木 × 金／朱紅） ===== */
  :root {
    --ink:#0a0f1e; --panel:#161f38; --panel-2:#1b2643; --panel-3:#0e1526;
    --line:#2b3a60; --line-soft:#213050;
    --gold:#e9b53f; --gold-2:#f8dc9a; --gold-dim:#8a6a20;
    --red:#e0452c; --jade:#37a56a; --jade-2:#6ee0a4; --sky:#7fc7f5; --plum:#c084fc;
    --txt:#e9eef8; --muted:#93a2c0; --muted-2:#6e7ea3;
    --wood-1:#3d2a1b; --wood-2:#573b25; --wood-3:#26170e;
    --shadow:0 12px 34px rgba(0,0,0,.5);
    --r:16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }   /* 單頁鎖定：整頁不捲動，捲動只發生在各區塊內 */
  body {
    margin: 0; color: var(--txt);
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    background:
      radial-gradient(1100px 560px at 12% -12%, #1e2c52 0%, transparent 62%),
      radial-gradient(900px 480px at 102% -4%, #2a1f3d 0%, transparent 58%),
      var(--ink);
  }
  /* 青海波底紋 */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .045;
    background-image: radial-gradient(circle at 50% 100%, transparent 9.5px, #a8d4ff 10.5px, transparent 11.5px);
    background-size: 36px 18px;
  }
  /* 整個畫面是固定 1600×900 的橫版，再等比縮放塞進瀏覽器視窗（不裁切、不變形） */
  #stageWrap { position: fixed; inset: 0; z-index: 1; overflow: hidden; }
  #app {
    position: absolute; top: 0; left: 0; width: 1600px; height: 900px;
    transform-origin: 0 0;
    display: grid; grid-template-columns: 268px minmax(440px, 1fr) 360px;
    gap: 12px; padding: 12px; align-items: stretch;
  }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; height: 100%; overflow: hidden; }

  /* 可伸縮的卡片：內容自己捲，頁面不捲 */
  .card.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .card.grow > .scroll { flex: 1; min-height: 0; overflow-y: auto; }

  /* 舞台：輪盤與魚機共用同一塊區域，高度吃剩下的空間 */
  .stage {
    position: relative; flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .stage canvas { height: 100%; width: auto; max-width: 100%; max-height: 100%; }
  #fish { display: none; }
  .stage.fishing #wheel { display: none; }
  .stage.fishing #fish { display: block; }

  /* 左欄：統計與玩家 */
  .kv { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; font-size: 12.5px; color: var(--muted); }
  .kv + .kv { border-top: 1px solid rgba(255,255,255,.055); }
  .kv b { font-size: 15px; font-weight: 800; color: var(--gold-2); font-variant-numeric: tabular-nums; }
  .kv b.g { color: var(--jade-2); }
  .player { display: flex; align-items: center; gap: 11px; }
  .avatar {
    width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-size: 25px;
    background: linear-gradient(180deg, #3b2c6e, #241a45); border: 1px solid #6d5bb0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
  }
  .player .pn { font-size: 14px; font-weight: 700; }
  .player .pc { font-size: 13px; color: var(--gold-2); font-weight: 800; font-variant-numeric: tabular-nums; }
  .player .pc i { font-style: normal; color: var(--muted-2); font-weight: 400; font-size: 11px; }

  /* 強開（開發用） */
  .force { display: flex; flex-wrap: wrap; gap: 7px; }
  .force .btn { font-size: 12px; padding: 6px 11px; }

  .card {
    background: linear-gradient(180deg, var(--panel), var(--panel-3));
    border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .card.mid { flex: 1; padding: 8px; display: flex; flex-direction: column; min-height: 0; }   /* 舞台吃滿中欄高度 */

  /* ---- 招牌（暖木頭 + 金字） ---- */
  .masthead {
    position: relative; overflow: hidden; margin: -12px -14px 10px; padding: 11px 14px 10px;
    border-radius: var(--r) var(--r) 0 0;
    background: linear-gradient(180deg, var(--wood-2), var(--wood-1) 58%, var(--wood-3));
    border-bottom: 1px solid #6b4a2d;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
  }
  .masthead::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .18;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,.4) 0 2px, transparent 2px 10px);
  }
  .mh-row { position: relative; display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .mh-title {
    font-size: 23px; font-weight: 900; letter-spacing: 2px; line-height: 1;
    background: linear-gradient(180deg, #fff6da, var(--gold) 55%, #a8761f);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.45));
  }
  .mh-sub { font-size: 11.5px; color: #d6b98f; letter-spacing: .5px; padding-bottom: 2px; }
  .mh-note { position: relative; margin-top: 6px; font-size: 10.5px; color: #b99b73; line-height: 1.55; }
  h1 { margin: 0; }
  h2 {
    display: flex; align-items: center; gap: 9px; margin: 0 0 9px; padding-bottom: 7px;
    font-size: 13.5px; font-weight: 700; letter-spacing: .6px; color: #dde7ff;
    border-bottom: 1px solid var(--line-soft); flex: 0 0 auto;
  }
  h2::before {
    content: ''; width: 4px; height: 17px; border-radius: 3px;
    background: linear-gradient(180deg, var(--gold-2), var(--gold-dim));
  }
  .sub { font-size: 11.5px; color: var(--muted-2); margin-bottom: 11px; line-height: 1.75; }
  canvas {
    display: block; border-radius: 14px; background: #080d19;
    border: 1px solid var(--line); box-shadow: inset 0 0 46px rgba(0,0,0,.65);
  }

  /* ---- 狀態燈（只剩魚機控制條在用） ---- */
  .stat {
    min-width: 84px; padding: 5px 11px; border-radius: 11px;
    background: linear-gradient(180deg, #0e1729, #080e1c);
    border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    display: flex; flex-direction: column; gap: 1px;
  }
  .stat span { font-size: 10.5px; letter-spacing: 1px; color: var(--muted-2); }
  .stat b {
    font-size: 18px; font-weight: 800; line-height: 1.15; color: var(--gold-2);
    font-variant-numeric: tabular-nums;
  }
  .stat.win b { color: var(--jade-2); }
  .stat.now b { color: var(--sky); }
  #cdStat b { color: #ff9ed2; }
  #cdStat.urge b { color: #ff5c5c; animation: cdBlink .6s steps(2, end) infinite; }
  @keyframes cdBlink { 50% { opacity: .28; } }

  /* ---- 壽司 chip ---- */
  /* 一種一整排：左邊種類名＋賠率，右邊本局有幾貫就排幾格 */
  .chips { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 4px; }
  .srow {
    display: flex; align-items: center; gap: 7px; padding: 3px 6px; border-radius: 10px;
    border: 1px solid transparent; background: rgba(255,255,255,.025);
  }
  .srow.on { border-color: var(--gold-dim); background: rgba(233,181,63,.08); }
  .sr-lb { display: flex; align-items: center; gap: 5px; flex: 0 0 104px; font-size: 11.5px; }
  .sr-lb b { font-weight: 700; color: #d7e2f7; }
  .sr-lb i { font-style: normal; margin-left: auto; font-size: 10.5px; font-weight: 800; color: #ffa9d0; }
  .sr-tiles { display: flex; gap: 4px; flex-wrap: wrap; }
  .sq {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: linear-gradient(180deg, #1c2742, #121a2e);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    transition: transform .1s, border-color .15s, box-shadow .15s;
  }
  .sq:hover { transform: translateY(-2px); border-color: var(--sky); }
  .sq.sel {
    border-color: var(--gold); background: linear-gradient(180deg, #3c2d0c, #241a06);
    box-shadow: inset 0 0 0 1px var(--gold), 0 0 12px rgba(233,181,63,.35);
  }
  .sq.hit { box-shadow: inset 0 0 0 2px var(--jade), 0 0 10px rgba(55,165,106,.35); }
  .chip {
    display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px;
    border: 1px solid var(--line); background: linear-gradient(180deg, #1c2742, #121a2e);
    cursor: pointer; font-size: 13px; user-select: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    transition: transform .1s, border-color .15s, box-shadow .15s;
  }
  .chip:hover { transform: translateY(-2px); border-color: var(--sky); }
  .chip.sel {
    border-color: var(--gold); background: linear-gradient(180deg, #3c2d0c, #241a06);
    box-shadow: inset 0 0 0 1px var(--gold), 0 0 18px rgba(233,181,63,.28);
  }
  .chip.hit { box-shadow: inset 0 0 0 2px var(--jade), 0 0 14px rgba(55,165,106,.3); }
  .chip .pk { font-size: 10px; color: var(--muted); background: rgba(255,255,255,.07); padding: 1px 7px; border-radius: 7px; }
  .chip .mul { font-size: 11.5px; font-weight: 800; color: #ffa9d0; font-variant-numeric: tabular-nums; }

  /* ---- 盤型分頁 ---- */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 0 0 9px; }
  .tab {
    position: relative; padding: 7px 6px; text-align: center; border-radius: 11px; cursor: pointer;
    font-size: 13.5px; font-weight: 800; color: #d3ddf3;
    background: linear-gradient(180deg, #1a2440, #101728); border: 1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    transition: transform .1s, border-color .15s;
  }
  .tab:hover { transform: translateY(-1px); }
  .tab i { display: block; font-size: 10.5px; font-weight: 400; font-style: normal; color: var(--muted); margin-top: 2px; }
  .tab.active { border-color: var(--gold); color: #fff; background: linear-gradient(180deg, #2c3757, #161e35); }
  .tab.active::after {
    content: ''; position: absolute; left: 20%; right: 20%; bottom: -1px; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .tab.dis { opacity: .42; cursor: not-allowed; transform: none; }

  /* ---- 按鈕 ---- */
  .combo { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn, .combo button {
    appearance: none; font: inherit; font-size: 12.5px; color: var(--txt); cursor: pointer;
    padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: linear-gradient(180deg, #23314f, #161f36);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 0 rgba(0,0,0,.4);
    transition: transform .07s, border-color .15s, color .15s;
  }
  .btn:hover, .combo button:hover { border-color: var(--gold); color: #fff; }
  .btn:active, .combo button:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .btn.pri {
    font-weight: 800; color: #eafff3; border-color: #4ec98a;
    background: linear-gradient(180deg, #33a86b, #1b6b43);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 3px 0 #10402a;
  }
  .btn.on { border-color: var(--gold); color: var(--gold-2); background: linear-gradient(180deg, #4b3714, #2a1f0a); }
  .btn:disabled { opacity: .38; cursor: not-allowed; transform: none; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 9px; }

  /* ---- 盤清單 ---- */
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
  th {
    position: sticky; top: 0; z-index: 1; background: #131b30;
    padding: 6px; text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 1px;
    color: var(--muted-2); border-bottom: 1px solid var(--line);
  }
  td { padding: 6px; border-bottom: 1px solid rgba(255,255,255,.055); vertical-align: middle; }
  td:nth-child(n+3) { font-variant-numeric: tabular-nums; }
  tbody tr:nth-child(odd) { background: rgba(255,255,255,.022); }
  tbody tr:hover { background: rgba(127,199,245,.07); }
  .free { color: #ff9ed2; font-weight: 800; font-size: 10.5px; letter-spacing: .5px; }
  .won { color: var(--jade-2); font-weight: 800; }
  .lost { color: var(--muted-2); }

  /* ---- 紀錄 ---- */
  /* ---- 開球紀錄：一局一列（局號＋5 顆球的壽司＋本局贏分） ---- */
  #log { font-size: 11.5px; padding-right: 4px; }
  .hrow {
    display: flex; align-items: center; gap: 7px; padding: 5px 7px; margin-bottom: 3px;
    border-radius: 9px; border: 1px solid transparent; background: rgba(255,255,255,.03);
  }
  .hrow.cur { border-color: var(--sky); background: rgba(127,199,245,.09); }
  .hrow.win { border-color: var(--jade); background: rgba(55,165,106,.12); }
  .hrow .hr-no { flex: 0 0 34px; color: var(--muted-2); font-variant-numeric: tabular-nums; }
  .hrow .hr-balls { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
  .hrow .hr-balls img { display: block; border-radius: 5px; background: rgba(255,255,255,.05); }
  .hrow .hr-sp {
    width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center;
    font-size: 12px; background: linear-gradient(180deg, #7c3aed, #4c1d95);
  }
  .hrow .hr-win { font-weight: 800; color: var(--jade-2); font-variant-numeric: tabular-nums; }
  .hrow .hr-none { color: var(--muted-2); }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-track { background: rgba(255,255,255,.03); border-radius: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: #2f3f66; border-radius: 9px; }
  .scroll::-webkit-scrollbar-thumb:hover { background: #3d5182; }

  /* ---- 事件面板（FREE / 老闆SP / 漁） ---- */
  .evt {
    display: none; flex: 0 0 auto; margin-top: 9px; padding: 9px 11px; border-radius: 13px;
    border: 1px solid var(--plum);
    background: linear-gradient(180deg, rgba(168,85,247,.16), rgba(88,28,135,.22));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }
  .evt h3 { margin: 0 0 5px; font-size: 14px; font-weight: 800; letter-spacing: .5px; color: #f0c8ff; }
  .evt.gold { border-color: var(--gold); background: linear-gradient(180deg, rgba(233,181,63,.15), rgba(120,80,10,.2)); }
  .evt.gold h3 { color: var(--gold-2); }
  .evt.sea { border-color: #2b9fd8; background: linear-gradient(180deg, rgba(43,159,216,.15), rgba(8,48,74,.3)); }
  .evt.sea h3 { color: #a5e2ff; }
  .fc-plate { border-top: 1px solid rgba(255,255,255,.12); padding: 8px 0 4px; font-size: 12.5px; }
  .fc-plate button { margin: 5px 5px 0 0; }
  .tag {
    display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 8px; margin-left: 5px;
    background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.18); color: #e4ecff;
  }

  /* ---- 中獎快報 ---- */
  /* 中獎快報：蓋在轉盤上（跟著版面一起縮放），不要 fixed 在瀏覽器視窗 */
  #toast {
    position: absolute; left: 50%; top: 26%; z-index: 8; pointer-events: none;
    transform: translate(-50%, -18px); opacity: 0; transition: opacity .22s, transform .22s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast-in {
    padding: 13px 30px; border-radius: 18px; text-align: center;
    font-size: 27px; font-weight: 900; letter-spacing: 2px; color: var(--gold-2);
    background: linear-gradient(180deg, #3d2c08, #1c1304);
    border: 1px solid var(--gold);
    box-shadow: 0 16px 48px rgba(0,0,0,.65), 0 0 46px rgba(233,181,63,.3), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .toast-in small { display: block; margin-top: 5px; font-size: 13.5px; font-weight: 500; color: #ffe6b3; letter-spacing: 0; }

  /* ---- 調參面板 ---- */
  #tune {
    position: fixed; right: 0; top: 0; width: 318px; height: 100vh; z-index: 60;
    padding: 14px; overflow-y: auto; transform: translateX(318px); transition: transform .22s;
    background: linear-gradient(180deg, #131c33, #0a1120);
    border-left: 1px solid var(--line); box-shadow: -16px 0 40px rgba(0,0,0,.5);
  }
  #tune.open { transform: none; }
  .tune-tab {
    padding: 6px 9px; font-size: 12px; cursor: pointer; border-radius: 9px;
    background: #0e1729; border: 1px solid var(--line); color: #c3d0ea;
  }
  .tune-tab.active { background: #17304f; border-color: var(--sky); color: var(--sky); }
  .tune-group {
    margin: 14px 0 6px; padding-bottom: 5px; font-size: 12px; font-weight: 700; letter-spacing: .5px;
    color: var(--gold-2); border-bottom: 1px solid var(--line-soft);
  }
  .tune-row { display: flex; align-items: center; gap: 7px; margin: 7px 0; }
  .tune-row label { flex: 0 0 116px; font-size: 11px; color: #c8d4ec; }
  .tune-row input[type=range] { flex: 1; min-width: 0; accent-color: var(--gold); }
  .tune-row input[type=number] {
    width: 58px; padding: 3px 5px; font-size: 11px; border-radius: 6px;
    background: #0b1120; border: 1px solid var(--line); color: var(--txt);
    font-variant-numeric: tabular-nums;
  }
  /* ---- 我的座位：一疊實體壽司盤，上面擺這組的壽司、正面印當選額（照實機） ---- */
  .seat-grp { display: flex; align-items: flex-end; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .seat-grp:last-child { border-bottom: 0; }
  .seat-col { min-width: 0; flex: 1; }
  .seat-head { display: flex; align-items: baseline; gap: 6px; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .seat-head b { font-size: 13px; color: #dde7ff; }
  .seat-head .sh-won { margin-left: auto; color: var(--jade-2); font-weight: 800; }
  .seat-head .sh-lost { margin-left: auto; color: var(--muted-2); }
  /* 疊子上方的壽司牌 */
  .tiles { display: flex; gap: 3px; }
  .tile {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 7px;
    background: #1a2440; border: 1.5px solid #46587f; box-shadow: 0 2px 4px rgba(0,0,0,.5);
  }
  .tile.off { opacity: .72; }
  .tile { position: relative; }
  .tile .tf {
    position: absolute; right: -3px; top: -4px; font-size: 9px; font-weight: 900;
    color: #2b0f3d; background: linear-gradient(90deg, #ffe08a, #ff9ed2);
    border-radius: 6px; padding: 0 3px; line-height: 12px;
  }
  .tile.pick {
    cursor: pointer; opacity: 1; border-color: #ff9ed2;
    animation: pickPulse 1s ease-in-out infinite;
  }
  .tile.pick:hover { border-color: #fff; transform: translateY(-2px); }
  @keyframes pickPulse {
    0%, 100% { box-shadow: 0 0 0 rgba(255,158,210,0); }
    50% { box-shadow: 0 0 12px rgba(255,158,210,.95); }
  }
  .free-badge.live { animation: pickPulse 1s ease-in-out infinite; }
  .tile.on { border-color: var(--jade-2); box-shadow: 0 0 10px rgba(110,224,164,.6); }
  .free-badge {
    display: inline-block; margin-bottom: 3px; padding: 1px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 900; letter-spacing: 1px; color: #2b0f3d;
    background: linear-gradient(90deg, #ff9ed2, #ffe08a, #8ee7c4, #9ec7ff);
  }
  /* 疊子本體 */
  .stack { position: relative; width: 128px; flex: 0 0 128px; }
  .stack .pl {
    position: absolute; left: 0; right: 0; height: 7px; border-radius: 999px;
    background: linear-gradient(180deg, #f4f7fb 40%, #aab4c6);
    border: 1px solid #8f9bb0; box-shadow: 0 1px 0 rgba(0,0,0,.35);
  }
  .stack .pl.red { background: linear-gradient(180deg, #ffd9d3 40%, #d3796a); border-color: #b4645a; }
  .stack .pl.gold { background: linear-gradient(180deg, #ffe9ae 40%, #cb9c37); border-color: #a97f22; }
  .stack.done .pl { box-shadow: 0 0 9px rgba(110,224,164,.55); }
  .stack .pay {
    position: absolute; left: 0; right: 0; bottom: 50%; transform: translateY(50%);
    text-align: center; line-height: 1.05;
  }
  .stack .pay b {
    display: block; font-size: 21px; font-weight: 900; letter-spacing: 1px;
    color: #fff6da; font-variant-numeric: tabular-nums;
