/* ============ 強開（測試用）============
   把 5 顆球擺好、照常結算本局押注，然後直接進老闆SP 並把 EX 球導到指定獎項。 */
function forceEvent(kind) {
  if (S.phase !== 'BET' && S.phase !== 'SETTLE') { log('抽球／SP／漁 進行中不能強開'); return; }
  // 布丁／JP 需要印章，強開時先把印章補足，方便展示
  if (kind === 'purin' && S.stamps < T.sp.stampPurin) S.stamps = T.sp.stampPurin;
  if (kind === 'jp' && S.stamps < T.sp.stampJP) S.stamps = T.sp.stampJP;
  if (S.phase === 'BET') {
    S.drawOrder = shuffle([...Array(16).keys()]).slice(0, 5);
    S.balls = S.drawOrder.slice();
    S.hitTypes = new Set(); S.hitCount = {};
    histNew(S.round);
    S.balls.forEach(i => {
      const t = S.pockets[i]; histBall(t);
      if (t !== SP_POCKET) { S.hitTypes.add(t); S.hitCount[t] = (S.hitCount[t] || 0) + 1; }
    });
    S.spHit = false;                 // 由強開接手，避免 settle 又觸發一次 SP
    S.phase = 'DRAW';
    log('（強開）直接擺好 5 顆球並結算本局', 'd');
    settle();
  }
  S.spItems = null; S.spFree = null; S.exBall = null; S.phase = 'SETTLE';
  startSP();
  if (kind !== 'sp' && S.spFree && S.spFree.length) {
    const idx = S.spFree[0];
    S.spItems[idx] = kind;
    S.spFree = [idx];                // dropEX 的 pick 一定落在這一格
    notice(`（強開）EX 球將落在 ${SP_ITEMS[kind].emoji}${SP_ITEMS[kind].label}`, true);
  }
  refreshAll();
}
document.querySelectorAll('[data-force]').forEach(b => {
  b.onclick = () => forceEvent(b.dataset.force);
});

/* ============ 調參面板 ============ */
let tuneTab = 'rhythm';
function buildTune() {
  const body = $('tuneBody'); body.innerHTML = '';
  const g = document.createElement('div'); g.className = 'tune-group';
  g.textContent = { rhythm: '節奏（即時生效）', prob: '機率（下一局生效）', econ: '賠率與經濟',
    sp: '老闆SP 獎項', fish: '漁' }[tuneTab];
  body.appendChild(g);
  TUNE_META[tuneTab].forEach(([key, label, min, max, step, opts]) => {
    const row = document.createElement('div'); row.className = 'tune-row';
    const lb = document.createElement('label'); lb.textContent = label;
    if (opts) {                       // 選單型參數（如內部狀態）
      const sl = document.createElement('select');
      sl.style.cssText = 'flex:1;min-width:0;padding:3px 5px;font-size:11px;border-radius:6px;background:#0b1120;border:1px solid var(--line);color:var(--txt)';
      opts.forEach((o, i) => { const op = document.createElement('option'); op.value = i; op.textContent = o; sl.appendChild(op); });
      sl.value = T[tuneTab][key];
      sl.onchange = () => { T[tuneTab][key] = Number(sl.value); saveTune(); refreshAll(); };
      row.append(lb, sl); body.appendChild(row); return;
    }
    const rg = document.createElement('input'); rg.type = 'range';
    rg.min = min; rg.max = max; rg.step = step; rg.value = T[tuneTab][key];
    const nb = document.createElement('input'); nb.type = 'number';
    nb.min = min; nb.max = max; nb.step = step; nb.value = T[tuneTab][key];
    const set = v => {
      v = Math.max(min, Math.min(max, Number(v)));
      T[tuneTab][key] = v; rg.value = v; nb.value = v; saveTune(); refreshAll();
    };
    rg.oninput = () => set(rg.value);
    nb.onchange = () => set(nb.value);
    row.append(lb, rg, nb); body.appendChild(row);
  });
}
document.querySelectorAll('.tune-tab').forEach(t => {
  t.onclick = () => {
    tuneTab = t.dataset.tt;
    document.querySelectorAll('.tune-tab').forEach(x => x.classList.toggle('active', x === t));
    buildTune();
  };
});
$('tuneBtn').onclick = () => $('tune').classList.toggle('open');
$('tuneReset').onclick = () => { T = JSON.parse(JSON.stringify(DEF)); saveTune(); buildTune(); refreshAll(); log('調參已還原預設', 'd'); };
$('tuneExport').onclick = () => {
  const s = JSON.stringify(Object.assign({ build: APP_BUILD }, T), null, 2);
  navigator.clipboard && navigator.clipboard.writeText(s);
  log('參數 JSON 已複製到剪貼簿', 'd');
  console.log(s);
};

/* ============ 自適應縮放：固定 1600×900 橫版，等比縮放並置中 ============ */
const BASE_W = 1600, BASE_H = 900;
function fitScreen() {
  const el = $('app');
  const s = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H);
  const x = (window.innerWidth - BASE_W * s) / 2;
  const y = (window.innerHeight - BASE_H * s) / 2;
  el.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
}
window.addEventListener('resize', fitScreen);
fitScreen();

/* ============ 啟動 ============ */
newBoard();
startBetPhase();
buildTune();
refreshAll();
log(`迴轉壽司賓果 demo（build ${APP_BUILD}）已載入。`, 'w');
log(`機台不停：押注 ${T.rhythm.betSeconds} 秒 → 自動開 5 球 → 結算 → 下一局。`, 'd');

/* 主迴圈（必須在 newBoard／startBetPhase 之後才啟動，否則第一幀會畫到空盤面）：輪盤一直緩慢自轉 → 每幀都要重畫；順便跑演出、倒數與自動開局 */
(function loop(now) {
  now = now || performance.now();
  stepWheel(now);
  stepFX(now);
  updateCd();
  if (S.phase === 'BET' && now >= S.betEndAt) deal();      // 押注時間到 → 自動開球
  if (S.phase === 'FREE' && now >= S.freeAt) endFree();    // FREE 沒選 → 自動繼續，機台不會等人
  if (S.phase !== 'FISH') draw();                          // 漁的時候輪盤被魚機蓋住，不用畫
  requestAnimationFrame(loop);
})();


/* 測試／情境用：一次設定「開出了哪些貫」 */
function setHits(arr) {
  S.hitTypes = new Set(arr);
  S.hitCount = {};
  arr.forEach(t => { S.hitCount[t] = (S.hitCount[t] || 0) + 1; });
}

/* ============ 開發用情境跳轉 ============
   在網址後加 #demo=win / sp / fish / dairyo / shunryo，載入後直接跳到該情境，
   方便截圖與回歸（不影響正常玩）。                                        */
(function devScenario() {
  const m = /demo=(\w+)/.exec(location.hash);
  if (!m) return;
  const k = m[1];
  setTimeout(() => {
    const ks = S.kinds.slice();
    if (k === 'deal') {          // 端對端：押三種盤型後真的跑完 5 顆球
      T.rhythm.ballTravel = 220; T.rhythm.ballGap = 60; T.rhythm.settlePause = 150;
      T.prob.freeChance = 0;
      addPlate('maru', ks.slice(0, 1));
      addPlate('geta', ks.slice(0, 3));
      if (ks.length >= 5) addPlate('funa', ks.slice(0, 5));
      deal();
      return;
    }
    if (k === 'win') {
      addPlate('geta', ks.slice(0, 3));
      setHits(ks.slice(0, 3));
      S.phase = 'DRAW'; S.balls = [0, 1, 2, 3, 4];
      settle();
      return;
    }
    addPlate('geta', ks.slice(0, 3));
    setHits([ks[0]]);
    S.plates[0].result = 0;
    S.balls = [0, 3, 6, 9, 12];
    S.phase = 'SETTLE';
    if (k === 'sp') { S.spItems = null; startSP(); return; }
    // fish / dairyo / shunryo：直接把 EX 球導到該獎項
    S.phase = 'SP';
    const free = []; for (let i = 0; i < 16; i++) if (!S.balls.includes(i)) free.push(i);
    S.spItems = {}; free.forEach(i => S.spItems[i] = 'gag');
    S.spFree = [free[0]];
    S.spItems[free[0]] = (k === 'fish' ? 'ryo' : k);
    resolveSP(free[0]);
    // 預先放幾隻魚，截圖才不用等生成
    for (let i = 0; i < 9; i++) {
      FISH.list.push({
        x: 55 + (i % 5) * 115, y: 55 + Math.floor(i / 5) * 105 + (i % 3) * 22, dy: 0,
        r: 14 + (i % 3) * 2, type: ks[i % ks.length], value: 12 + i * 4,
        school: k === 'dairyo' && i % 3 === 0, shun: k === 'shunryo' && i === 4, tier: 120,
        dead: false, phase: i, amp: 8, vx: i % 2 ? 55 : -55,
      });
    }
  }, 60);
})();

/* ============ 自動測試掛勾（供 headless 驗證用） ============ */
window.__TEST__ = {
  S, T, FISH, FX, draw, drawFish, stepFX, celebrate, drawFishShape,
  hitProb, multOf, newBoard, addPlate, deal, nextRound,
  startSP, dropEX, resolveSP, startFishing, endFishing, catchFish, settle,
  SP_ITEMS, STATE_NAME, stateMul, catchChance, betLeft, startBetPhase, endFree, stepWheel,
  autoFreePick, HIST, missingOf, addPlates, canAddCount, roundCap, addWin, pickSlot, applyWheelScale, inReach, startTug, stepTug, fishXY, plateDone, needMap, haveOf, renderSeat, fitScreen, payRange, startFx, bannerFx, useFree, freeCands,
  refreshAll, KIND_SIZE, STAKE, setHits, hitProb, gainStamp, renderStamps, BELT, makeBelt, pickBelt, beltAngle, refreshBeltPay, GW, GH, HD,
  // 強制讓某一格變成指定獎項，方便逐條驗證老闆SP 的分支
  forceSP(item) {
    const free = []; for (let i = 0; i < 16; i++) if (!S.balls.includes(i)) free.push(i);
    S.spItems = {}; free.forEach(i => S.spItems[i] = 'gag');
    S.spFree = [free[0]]; S.spItems[free[0]] = item;
    return free[0];
  },
  probeMultRange() {
    // 掃 200 局，檢查各盤型倍率是否落在原機公開範圍內
    const out = { maru: [9e9, -9e9], geta: [9e9, -9e9], funa: [9e9, -9e9] };
    for (let i = 0; i < 200; i++) {
      newBoard();
      const ks = S.kinds;
      const test = { maru: 1, geta: 3, funa: 5 };
      for (const k of Object.keys(test)) {
        const n = test[k];
        if (ks.length < n) continue;
        const sel = shuffle(ks.slice()).slice(0, n);
        const m = multOf(k, sel);
        out[k][0] = Math.min(out[k][0], m); out[k][1] = Math.max(out[k][1], m);
      }
    }
    return out;
  },
};
